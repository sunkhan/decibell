syntax = "proto3";
package chatproj;

// --- Video codec negotiation ---
// Wire-compatible with the legacy single-codec setup: CODEC_H264_HW = 1
// preserves the value the existing Tauri client has been stamping in
// UdpVideoPacket.codec since launch. CODEC_UNKNOWN = 0 reclaims the
// retired CODEC_VP9 slot — server has always been codec-agnostic on
// the relay path so the change has no on-wire impact.
enum VideoCodec {
  CODEC_UNKNOWN = 0;
  CODEC_H264_HW = 1;
  CODEC_H264_SW = 2;
  CODEC_H265 = 3;
  CODEC_AV1 = 4;
}

message CodecCapability {
  VideoCodec codec = 1;
  uint32 max_width = 2;
  uint32 max_height = 3;
  uint32 max_fps = 4;
}

message ClientCapabilities {
  repeated CodecCapability encode = 1;
  repeated CodecCapability decode = 2;
}

message Packet {
  enum Type {
    UNKNOWN = 0;
    HANDSHAKE = 1;
    REGISTER_REQ = 2;
    REGISTER_RES = 3;
    LOGIN_REQ = 4;
    LOGIN_RES = 5;
    DIRECT_MSG = 6;
    PRESENCE_UPDATE = 7;
    SERVER_LIST_REQ = 8;
    SERVER_LIST_RES = 9;

    // Community Server Specific Types
    COMMUNITY_AUTH_REQ = 10;
    COMMUNITY_AUTH_RES = 11;
    CHANNEL_MSG = 12;
    reserved 13, 14;
    reserved "JOIN_CHANNEL_REQ", "JOIN_CHANNEL_RES";

    // Friend System Types
    FRIEND_ACTION_REQ = 15;
    FRIEND_ACTION_RES = 16;
    FRIEND_LIST_REQ = 17;
    FRIEND_LIST_RES = 18;

    JOIN_VOICE_REQ = 19;
    LEAVE_VOICE_REQ = 20;
    VOICE_PRESENCE_UPDATE = 21;
    VOICE_STATE_NOTIFY = 27;
    DM_PRIVACY = 28;

    // Screen Sharing Signaling
    STREAM_PRESENCE_UPDATE = 22;
    START_STREAM_REQ = 23;
    STOP_STREAM_REQ = 24;
    WATCH_STREAM_REQ = 25;
    STOP_WATCHING_REQ = 26;
    STREAM_THUMBNAIL_UPDATE = 29;
    SERVER_HEARTBEAT = 30;
    CLIENT_PING = 31;       // Client→central keepalive (no payload needed)

    // Membership + invites (community server)
    INVITE_CREATE_REQ = 32;
    INVITE_CREATE_RES = 33;
    INVITE_LIST_REQ = 34;
    INVITE_LIST_RES = 35;
    INVITE_REVOKE_REQ = 36;
    INVITE_REVOKE_RES = 37;
    MEMBER_LIST_REQ = 38;
    MEMBER_LIST_RES = 39;
    KICK_MEMBER_REQ = 40;
    BAN_MEMBER_REQ = 41;
    MOD_ACTION_RES = 42;    // shared kick/ban/leave response
    LEAVE_SERVER_REQ = 43;
    SERVER_META_UPDATE = 44; // server pushes owner/name/etc to client after auth
    MEMBERSHIP_REVOKED = 45; // server→client: you were kicked/banned

    // Central-hosted invite lookup (so clients can redeem a raw code
    // without knowing the hosting community server's host:port).
    INVITE_REGISTER_REQ = 46;    // community→central (shared secret)
    INVITE_UNREGISTER_REQ = 47;  // community→central (shared secret)
    INVITE_RESOLVE_REQ = 48;     // client→central (JWT)
    INVITE_RESOLVE_RES = 49;     // central→client

    // Persistent channel messages + per-channel retention.
    CHANNEL_HISTORY_REQ = 50;    // client→community
    CHANNEL_HISTORY_RES = 51;    // community→client
    CHANNEL_UPDATE_REQ = 52;     // client→community (owner-only)
    CHANNEL_UPDATE_RES = 53;     // community→client
    CHANNEL_PRUNED = 54;         // community→client: retention sweep happened
    CHANNEL_WIPE_REQ = 55;       // client→community (owner-only): nuke all messages in a channel
    CHANNEL_WIPE_RES = 56;       // community→requester: result of the wipe
    CHANNEL_WIPED = 57;          // community→all members: channel was wiped, drop local message state

    // Video codec negotiation.
    STREAM_CODEC_CHANGED_NOTIFY = 58;  // streamer→server→all in channel
    UPDATE_CAPABILITIES_REQ = 59;      // client→community when caps refreshed mid-session
    STREAM_WATCHER_NOTIFY = 60;        // server→streamer on watch/unwatch (Plan C)

    // Avatar bytes + cache-invalidation broadcast.
    UPDATE_AVATAR_REQ = 61;            // client→central
    UPDATE_AVATAR_RES = 62;            // central→client
    FETCH_AVATAR_REQ = 63;             // client→central
    FETCH_AVATAR_RES = 64;             // central→client
    AVATAR_CHANGED = 65;               // central→the account's watchers

    // Live-stream popup: on-demand thumbnail fetch (community server).
    FETCH_STREAM_THUMBNAIL_REQ = 66;
    FETCH_STREAM_THUMBNAIL_RES = 67;

    // Persistent DMs — see docs/superpowers/specs/
    // 2026-05-14-persistent-dms-design.md
    DM_CONVERSATIONS_REQ = 68;   // client→central; empty payload
    DM_CONVERSATIONS_RES = 69;   // central→client
    DM_HISTORY_REQ       = 70;   // client→central
    DM_HISTORY_RES       = 71;   // central→client
    DM_MARK_READ_REQ     = 72;   // client→central; fire-and-forget

    // Auto-rejoin — see docs/superpowers/specs/
    // 2026-05-14-auto-rejoin-communities-design.md (+ implementation
    // plan amendment: SERVER_HEARTBEAT_RES plumbs the assigned
    // server_id back to the community so it can populate the
    // membership packets).
    MEMBERSHIP_REGISTER_REQ = 73;  // community→central (shared secret)
    MEMBERSHIP_REVOKE_REQ   = 74;  // community→central (shared secret)
                                    // AND client→central (JWT) for stale cleanup
    SERVER_HEARTBEAT_RES    = 75;  // central→community (one-shot, post-heartbeat)

    // --- Message deletion ---
    // (see docs/superpowers/specs/2026-05-15-message-deletion-design.md)
    DM_DELETE_REQ           = 76;   // client→central; JWT-authed
    DM_DELETE_RES           = 77;   // central→requester
    DM_MESSAGE_DELETED      = 78;   // central→sender + recipient (success only)
    MESSAGE_DELETE_REQ      = 79;   // client→community
    MESSAGE_DELETE_RES      = 80;   // community→requester
    CHANNEL_MESSAGE_DELETED = 81;   // community→all members (success only)

    // --- Custom server pictures ---
    // (see docs/superpowers/specs/2026-05-15-custom-server-pictures-design.md)
    UPDATE_SERVER_PICTURE_REQ = 82;  // client→community (JWT)
    UPDATE_SERVER_PICTURE_RES = 83;  // community→requester
    SYNC_SERVER_PICTURE_REQ   = 84;  // community→central (shared secret)
    FETCH_SERVER_PICTURE_REQ  = 85;  // client→central (JWT)
    FETCH_SERVER_PICTURE_RES  = 86;  // central→requester
    SERVER_PICTURE_CHANGED    = 87;  // central→every online member

    // --- Roles + permissions (community server) ---
    // See docs/superpowers/specs/2026-08-17-roles-permissions-design.md
    // and the Permission enum for the bitfield the role carries.
    ROLE_LIST_REQ           = 88;  // client→community
    ROLE_LIST_RES           = 89;  // community→client; pushed after auth and
                                   // broadcast to everyone on any role change
    ROLE_CREATE_REQ         = 90;  // client→community (MANAGE_ROLES)
    ROLE_UPDATE_REQ         = 91;  // client→community (MANAGE_ROLES + hierarchy)
    ROLE_DELETE_REQ         = 92;  // client→community (MANAGE_ROLES + hierarchy)
    ROLE_ACTION_RES         = 93;  // community→requester: create/update/delete/assign result
    MEMBER_ROLES_UPDATE_REQ = 94;  // client→community: replace a member's role set
    UNBAN_MEMBER_REQ        = 95;  // client→community (BAN_MEMBERS); response via MOD_ACTION_RES

    // --- Channel management + nicknames ---
    // (MANAGE_CHANNELS / MANAGE_NICKNAMES; see the roles spec doc)
    CHANNEL_CREATE_REQ  = 96;   // client→community (MANAGE_CHANNELS)
    CHANNEL_DELETE_REQ  = 97;   // client→community (MANAGE_CHANNELS)
    CHANNEL_RENAME_REQ  = 98;   // client→community (MANAGE_CHANNELS)
    CHANNEL_ACTION_RES  = 99;   // community→requester: create/rename/delete result
    CHANNEL_LIST_UPDATE = 100;  // community→all members: full channel list push
    SET_NICKNAME_REQ    = 101;  // client→community (self, or MANAGE_NICKNAMES);
                                // response via MOD_ACTION_RES action="nickname"
    CHANNEL_REORDER_REQ = 102;  // client→community (MANAGE_CHANNELS):
                                // full new order after a drag; response via
                                // CHANNEL_ACTION_RES action="reorder"

    // --- Per-channel permission overwrites (permissions v2) ---
    // See docs/superpowers/specs/2026-08-22-permissions-v2-design.md
    CHANNEL_OVERWRITE_SET_REQ = 103; // client→community (MANAGE_ROLES in channel);
                                     // response via CHANNEL_ACTION_RES action="overwrite"
    CHANNEL_OVERWRITES_REQ    = 104; // client→community
    CHANNEL_OVERWRITES_RES    = 105; // community→client; also pushed after a change

    // --- Roster deltas (replaces full-roster pushes) ---
    // See "Roster protocol" below. MEMBER_LIST_REQ/RES (38/39) are now a
    // PAGED snapshot fetched on demand; live changes arrive as deltas.
    MEMBER_UPSERT = 106;   // community→all: one member joined / changed / presence flipped
    MEMBER_REMOVE = 107;   // community→all: one member left / was kicked or banned
    BAN_LIST_REQ  = 108;   // client→community (BAN_MEMBERS)
    BAN_LIST_RES  = 109;   // community→BAN_MEMBERS holders; pushed on change

    // --- Server management + moderation (2026-08-22) ---
    SERVER_UPDATE_REQ      = 110;  // client→community (MANAGE_SERVER): name/description
    SERVER_UPDATE_RES      = 111;  // community→requester; everyone gets SERVER_META_UPDATE
    AUDIT_LOG_REQ          = 112;  // client→community (VIEW_AUDIT_LOG)
    AUDIT_LOG_RES          = 113;  // community→requester
    TIMEOUT_MEMBER_REQ     = 114;  // client→community (MODERATE_MEMBERS + hierarchy);
                                   // response via MOD_ACTION_RES action="timeout"
    VOICE_MOD_REQ          = 115;  // client→community (VOICE_MODERATE + hierarchy);
                                   // response via MOD_ACTION_RES action="voice_mod"
    VOICE_FORCE_NOTIFY     = 116;  // community→target: you were moved / disconnected
    TRANSFER_OWNERSHIP_REQ = 117;  // client→community (owner only);
                                   // response via MOD_ACTION_RES action="transfer"
    STORAGE_INFO_REQ       = 118;  // client→community (MANAGE_SERVER): host disk + this
                                   // server's footprint
    STORAGE_INFO_RES       = 119;  // community→requester
    STORAGE_CONFIG_SET_REQ = 120;  // client→community (MANAGE_SERVER): set min-free
                                   // headroom; replies with a fresh STORAGE_INFO_RES
    DM_EDIT_REQ             = 121;  // client→central; JWT-authed (own DM only)
    DM_EDIT_RES            = 122;   // central→editor
    DM_MESSAGE_EDITED      = 123;   // central→sender + recipient (success only)
    MESSAGE_EDIT_REQ       = 124;   // client→community (own channel message only)
    MESSAGE_EDIT_RES       = 125;   // community→editor
    CHANNEL_MESSAGE_EDITED = 126;   // community→channel viewers (success only)
    // A CHANNEL_MSG the community did not accept — rate limit, slowmode,
    // permission, attachment cap, persist failure. Names the request's
    // nonce so the sender withdraws exactly that optimistic bubble.
    // MOD_ACTION_RES(action="message") still follows it for older clients.
    CHANNEL_MSG_REJECTED = 127;     // community→sender
    // P2P DM calls: ephemeral handshake relay (invite / accept / candidates /
    // hang-up / stream presence). Central stamps `from`, never persists,
    // and answers PEER_OFFLINE / NOT_ALLOWED itself. See
    // docs/superpowers/specs/2026-08-28-p2p-dm-calls-design.md.
    CALL_SIGNAL = 128;              // client→central→client
    // End-to-end encrypted DMs: identity-key publication / lookup and the
    // passphrase-wrapped private-key backup. Central stores and relays
    // public keys and opaque blobs; it never sees a private key or a
    // plaintext. See docs/superpowers/specs/2026-09-03-e2ee-dms-design.md.
    E2EE_PUBLISH_KEYS_REQ = 129;    // client→central (JWT): own bundle and/or backup
    E2EE_PUBLISH_KEYS_RES = 130;    // central→client
    E2EE_FETCH_KEYS_REQ   = 131;    // client→central: a user's bundle (current or by key_id)
    E2EE_FETCH_KEYS_RES   = 132;    // central→client
    E2EE_FETCH_BACKUP_REQ = 133;    // client→central: the caller's own backup blob
    E2EE_FETCH_BACKUP_RES = 134;    // central→client
    E2EE_KEYS_CHANGED     = 135;    // central→the account's watchers and its other sessions: a new bundle
    // MLS-encrypted voice channels (docs/superpowers/specs/
    // 2026-09-03-mls-voice-channel-encryption-design.md). The community
    // server is the MLS delivery service: it sequences commits per voice
    // channel, keeps the current GroupInfo for external joins, and forwards
    // opaque handshake bytes to the channel's participants. It never holds
    // a key.
    MLS_GROUP_INFO_REQ   = 136;     // client→community
    MLS_GROUP_INFO_RES   = 137;     // community→client
    MLS_GROUP_CREATE_REQ = 138;     // client→community (epoch 0); answered with MLS_COMMIT_RES
    MLS_COMMIT_REQ       = 139;     // client→community (epoch must be current + 1)
    MLS_COMMIT_RES       = 140;     // community→committer
    MLS_COMMIT_BROADCAST = 141;     // community→channel participants except the committer
    // Encrypted text channels (docs/superpowers/specs/
    // 2026-09-04-encrypted-text-channels-design.md): per-channel epoch keys
    // escrowed to members as envelopes sealed to their identities. The
    // community server stores opaque blobs per recipient, sequences epochs,
    // and names a "filler" when a member lacks keys. Never a key.
    CHANNEL_KEYS_REQ         = 142; // client→community
    CHANNEL_KEYS_RES         = 143; // community→client
    CHANNEL_KEYS_PUBLISH_REQ = 144; // client→community (new epoch or gap fill)
    CHANNEL_KEYS_PUBLISH_RES = 145; // community→publisher
    CHANNEL_KEYS_CHANGED     = 146; // community→viewers of the channel
    // Permissions v3 (docs/superpowers/specs/2026-10-09-permissions-v3-design.md):
    // drop a channel's own overwrites and follow its category again.
    CHANNEL_PERMISSIONS_SYNC_REQ = 147; // client→community (MANAGE_ROLES in channel);
                                        // response via CHANNEL_ACTION_RES action="sync"
    // Turn a category's permission sync on / off (off = visual grouping only).
    CATEGORY_SYNC_SET_REQ = 148;        // client→community (MANAGE_ROLES in the category);
                                        // response via CHANNEL_ACTION_RES action="category_sync"
    // User statuses (docs/superpowers/specs/2026-10-11-user-status-design.md):
    // central owns the chosen status; communities only learn "hide me".
    PRESENCE_DELTA      = 149;  // central→authenticated sessions: one user's presence changed
    SET_STATUS_REQ      = 150;  // client→central: chosen status (persisted)
    SET_IDLE_REQ        = 151;  // client→central: auto-away idle flag (session only)
    PRESENCE_VISIBILITY = 152;  // client→community: report me offline while invisible
    // Custom status messages (docs/superpowers/specs/2026-10-12-status-messages-design.md).
    SET_STATUS_MESSAGE_REQ = 153; // client→central: custom status text + emoji (persisted)
    // Server-settings member search: every member (online or not) matching
    // a name and/or role, paged by username. Separate from the roster so
    // search results never land in the member sidebar.
    MEMBER_SEARCH_REQ = 154;      // client→community (any member)
    MEMBER_SEARCH_RES = 155;      // community→requester
    // Message search over the text channels the requester can read
    // (docs/superpowers/specs/2026-10-14-message-search-design.md).
    MESSAGE_SEARCH_REQ = 156;     // client→community (any member)
    MESSAGE_SEARCH_RES = 157;     // community→requester
    // Username changes (docs/superpowers/specs/2026-10-15-uid-identity-design.md,
    // stage 5): password-confirmed, the old name reserved for 14 days.
    RENAME_REQ   = 158;   // client→central
    RENAME_RES   = 159;   // central→requester
    USER_RENAMED = 160;   // central→the account's watchers and its other sessions: its new name
    // Token renewal: central mints a fresh token for the signed-in session
    // (renames, and before the 24 h expiry); the client hands it to each
    // community it's connected to, which updates the session in place.
    TOKEN_REFRESH_REQ    = 161;   // client→central
    TOKEN_REFRESH_RES    = 162;   // central→requester
    SESSION_TOKEN_UPDATE = 163;   // client→community (no reply)
    // Presence by subscription (docs/superpowers/specs/2026-10-15-central-
    // scaling-design.md): the accounts a client shows; answered with a
    // PRESENCE_UPDATE for the newly watched.
    PRESENCE_SUBSCRIBE   = 164;   // client→central
    // Key escrow (review S14): a member drops their own blobs that won't
    // open, so a holder can seal them again.
    CHANNEL_KEYS_REJECT  = 165;   // client→community (no reply)
    // "Invite friends": which of my friends are already in a community I'm in.
    FRIENDS_IN_COMMUNITY_REQ = 166;   // client→central
    FRIENDS_IN_COMMUNITY_RES = 167;   // central→requester
    // Multi-device sign-in (docs/superpowers/specs/2026-10-18-multi-device-design.md):
    // what one device of an account did, for its other devices.
    DM_READ_SYNC     = 168;   // central→the reader's other sessions
    OWN_PRESENCE     = 169;   // central→every session of the account
    MEMBERSHIP_ADDED = 170;   // central→every session of the account
    SESSION_CLOSED   = 171;   // central→a session it is about to close
  }

  Type type = 1;
  int64 timestamp = 2;
  string auth_token = 16;

  // Retired oneof field numbers — do not reuse. JOIN_CHANNEL_REQ/RES
  // were removed when text channels became a per-session subscription
  // implicit in COMMUNITY_AUTH_REQ rather than an explicit join.
  reserved 15, 17;
  reserved "join_channel_req", "join_channel_res";

  oneof payload {
    Handshake handshake = 3;
    RegisterRequest register_req = 4;
    RegisterResponse register_res = 5;
    LoginRequest login_req = 6;
    LoginResponse login_res = 7;
    DirectMessage direct_msg = 8;
    PresenceUpdate presence_update = 9;
    ServerListRequest server_list_req = 10;
    ServerListResponse server_list_res = 11;

    CommunityAuthRequest community_auth_req = 12;
    CommunityAuthResponse community_auth_res = 13;
    ChannelMessage channel_msg = 14;

    FriendActionReq friend_action_req = 18;
    FriendActionRes friend_action_res = 19;
    FriendListReq friend_list_req = 20;
    FriendListRes friend_list_res = 21;

    JoinVoiceRequest join_voice_req = 22;
    LeaveVoiceRequest leave_voice_req = 23;
    VoicePresenceUpdate voice_presence_update = 24;
    VoiceStateNotify voice_state_notify = 30;

    StreamPresenceUpdate stream_presence_update = 25;
    StartStreamRequest start_stream_req = 26;
    StopStreamRequest stop_stream_req = 27;
    WatchStreamRequest watch_stream_req = 28;
    StopWatchingRequest stop_watching_req = 29;
    DmPrivacySetting dm_privacy = 31;
    StreamThumbnailUpdate stream_thumbnail_update = 32;
    ServerHeartbeat server_heartbeat = 33;

    InviteCreateRequest invite_create_req = 34;
    InviteCreateResponse invite_create_res = 35;
    InviteListRequest invite_list_req = 36;
    InviteListResponse invite_list_res = 37;
    InviteRevokeRequest invite_revoke_req = 38;
    InviteRevokeResponse invite_revoke_res = 39;
    MemberListRequest member_list_req = 40;
    MemberListResponse member_list_res = 41;
    KickMemberRequest kick_member_req = 42;
    BanMemberRequest ban_member_req = 43;
    ModActionResponse mod_action_res = 44;
    LeaveServerRequest leave_server_req = 45;
    ServerMetaUpdate server_meta_update = 46;
    MembershipRevoked membership_revoked = 47;

    InviteRegisterRequest invite_register_req = 48;
    InviteUnregisterRequest invite_unregister_req = 49;
    InviteResolveRequest invite_resolve_req = 50;
    InviteResolveResponse invite_resolve_res = 51;

    ChannelHistoryRequest channel_history_req = 52;
    ChannelHistoryResponse channel_history_res = 53;
    ChannelUpdateRequest channel_update_req = 54;
    ChannelUpdateResponse channel_update_res = 55;
    ChannelPruned channel_pruned = 56;
    ChannelWipeRequest channel_wipe_req = 57;
    ChannelWipeResponse channel_wipe_res = 58;
    ChannelWiped channel_wiped = 59;

    StreamCodecChangedNotify stream_codec_changed_notify = 60;
    UpdateCapabilitiesRequest update_capabilities_req = 61;
    StreamWatcherNotify stream_watcher_notify = 62;

    // --- Avatar messages (see docs/superpowers/specs/
    //     2026-05-12-custom-profile-pictures-design.md §4) ---
    UpdateAvatarReq update_avatar_req = 63;
    UpdateAvatarRes update_avatar_res = 64;
    FetchAvatarReq fetch_avatar_req = 65;
    FetchAvatarRes fetch_avatar_res = 66;
    AvatarChanged avatar_changed = 67;

    // --- Live-stream popup thumbnails (see docs/superpowers/specs/
    //     2026-05-14-live-stream-indicators-design.md §2) ---
    FetchStreamThumbnailReq fetch_stream_thumbnail_req = 68;
    FetchStreamThumbnailRes fetch_stream_thumbnail_res = 69;

    // --- Persistent DMs (see docs/superpowers/specs/
    //     2026-05-14-persistent-dms-design.md) ---
    DmConversationsReq dm_conversations_req = 70;
    DmConversationsRes dm_conversations_res = 71;
    DmHistoryReq       dm_history_req       = 72;
    DmHistoryRes       dm_history_res       = 73;
    DmMarkReadReq      dm_mark_read_req     = 74;

    // --- Auto-rejoin community memberships ---
    MembershipRegisterReq membership_register_req = 75;
    MembershipRevokeReq   membership_revoke_req   = 76;
    ServerHeartbeatRes    server_heartbeat_res    = 77;

    // --- Message deletion ---
    DmDeleteReq           dm_delete_req           = 78;
    DmDeleteRes           dm_delete_res           = 79;
    DmMessageDeleted      dm_message_deleted      = 80;
    MessageDeleteReq      message_delete_req      = 81;
    MessageDeleteRes      message_delete_res      = 82;
    ChannelMessageDeleted channel_message_deleted = 83;

    // --- Custom server pictures ---
    UpdateServerPictureReq update_server_picture_req = 84;
    UpdateServerPictureRes update_server_picture_res = 85;
    SyncServerPictureReq   sync_server_picture_req   = 86;
    FetchServerPictureReq  fetch_server_picture_req  = 87;
    FetchServerPictureRes  fetch_server_picture_res  = 88;
    ServerPictureChanged   server_picture_changed    = 89;

    // --- Roles + permissions ---
    RoleListRequest          role_list_req           = 90;
    RoleListResponse         role_list_res           = 91;
    RoleCreateRequest        role_create_req         = 92;
    RoleUpdateRequest        role_update_req         = 93;
    RoleDeleteRequest        role_delete_req         = 94;
    RoleActionResponse       role_action_res         = 95;
    MemberRolesUpdateRequest member_roles_update_req = 96;
    UnbanMemberRequest       unban_member_req        = 97;

    // --- Channel management + nicknames ---
    ChannelCreateRequest  channel_create_req  = 98;
    ChannelDeleteRequest  channel_delete_req  = 99;
    ChannelRenameRequest  channel_rename_req  = 100;
    ChannelActionResponse channel_action_res  = 101;
    ChannelListUpdate     channel_list_update = 102;
    SetNicknameRequest    set_nickname_req    = 103;
    ChannelReorderRequest channel_reorder_req = 104;

    // --- Per-channel permission overwrites ---
    ChannelOverwriteSetRequest channel_overwrite_set_req = 105;
    ChannelOverwritesRequest   channel_overwrites_req    = 106;
    ChannelOverwritesResponse  channel_overwrites_res    = 107;

    // --- Roster deltas ---
    MemberUpsert    member_upsert = 108;
    MemberRemove    member_remove = 109;
    BanListRequest  ban_list_req  = 110;
    BanListResponse ban_list_res  = 111;

    // --- Server management + moderation ---
    ServerUpdateRequest      server_update_req      = 112;
    ServerUpdateResponse     server_update_res      = 113;
    AuditLogRequest          audit_log_req          = 114;
    AuditLogResponse         audit_log_res          = 115;
    TimeoutMemberRequest     timeout_member_req     = 116;
    VoiceModRequest          voice_mod_req          = 117;
    VoiceForceNotify         voice_force_notify     = 118;
    TransferOwnershipRequest transfer_ownership_req = 119;
    StorageInfoRequest       storage_info_req       = 120;
    StorageInfoResponse      storage_info_res       = 121;
    StorageConfigSetRequest  storage_config_set_req = 122;
    DmEditReq                dm_edit_req            = 123;
    DmEditRes                dm_edit_res            = 124;
    DmMessageEdited          dm_message_edited      = 125;
    MessageEditReq           message_edit_req       = 126;
    MessageEditRes           message_edit_res       = 127;
    ChannelMessageEdited     channel_message_edited = 128;
    ChannelMessageRejected   channel_msg_rejected   = 129;
    CallSignal               call_signal            = 130;
    E2eePublishKeysReq       e2ee_publish_keys_req  = 131;
    E2eePublishKeysRes       e2ee_publish_keys_res  = 132;
    E2eeFetchKeysReq         e2ee_fetch_keys_req    = 133;
    E2eeFetchKeysRes         e2ee_fetch_keys_res    = 134;
    E2eeFetchBackupReq       e2ee_fetch_backup_req  = 135;
    E2eeFetchBackupRes       e2ee_fetch_backup_res  = 136;
    E2eeKeysChanged          e2ee_keys_changed      = 137;
    MlsGroupInfoReq          mls_group_info_req     = 138;
    MlsGroupInfoRes          mls_group_info_res     = 139;
    MlsGroupCreateReq        mls_group_create_req   = 140;
    MlsCommitReq             mls_commit_req         = 141;
    MlsCommitRes             mls_commit_res         = 142;
    MlsCommitBroadcast       mls_commit_broadcast   = 143;
    ChannelKeysReq           channel_keys_req       = 144;
    ChannelKeysRes           channel_keys_res       = 145;
    ChannelKeysPublishReq    channel_keys_publish_req = 146;
    ChannelKeysPublishRes    channel_keys_publish_res = 147;
    ChannelKeysChanged       channel_keys_changed   = 148;
    ChannelPermissionsSyncRequest channel_permissions_sync_req = 149;
    CategorySyncSetRequest   category_sync_set_req  = 150;
    PresenceDelta            presence_delta         = 151;
    SetStatusRequest         set_status_req         = 152;
    SetIdleRequest           set_idle_req           = 153;
    PresenceVisibility       presence_visibility    = 154;
    SetStatusMessageRequest  set_status_message_req = 155;
    MemberSearchRequest      member_search_req      = 156;
    MemberSearchResponse     member_search_res      = 157;
    MessageSearchRequest     message_search_req     = 158;
    MessageSearchResponse    message_search_res     = 159;
    RenameRequest            rename_req             = 160;
    RenameResponse           rename_res             = 161;
    UserRenamed              user_renamed           = 162;
    TokenRefreshRequest      token_refresh_req      = 163;
    TokenRefreshResponse     token_refresh_res      = 164;
    SessionTokenUpdate       session_token_update   = 165;
    PresenceSubscribe        presence_subscribe     = 166;
    ChannelKeysReject        channel_keys_reject    = 167;
    FriendsInCommunityRequest  friends_in_community_req = 168;
    FriendsInCommunityResponse friends_in_community_res = 169;
    DmReadSync               dm_read_sync           = 170;
    OwnPresence              own_presence           = 171;
    MembershipAdded          membership_added       = 172;
    SessionClosed            session_closed         = 173;
  }
}

message Handshake {
  int32 protocol_version = 1;
  string client_id = 2;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3; 
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // presence_deltas: every client takes deltas, for the accounts it
  // subscribes to (PRESENCE_SUBSCRIBE).
  reserved 3;
  // A dropped connection signing back in: the LoginResponse.resume_token of
  // its last password sign-in, instead of username / password. A refusal
  // (expired, or the account is gone) means signing in by password.
  string resume_token = 4;
  // This install, made once at random (multi-device design; at most 64
  // bytes). A login from the same device id replaces that device's previous
  // connection; other device ids stay signed in alongside. Empty counts as a
  // device of its own every time.
  string device_id = 5;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string jwt_token = 3;
  // Auto-rejoin: server-populated list of community servers this user
  // is a member of. Drives the auto-rejoin flow — see
  // docs/superpowers/specs/2026-05-14-auto-rejoin-communities-design.md.
  // Absent / empty on legacy servers; client treats as empty.
  repeated CommunityServerInfo memberships = 4;
  // P2P DM calls: STUN servers ("host:port") the client should use for
  // reflexive-candidate discovery (DECIBELL_STUN_SERVERS on central).
  // Empty on an older central or when unset → client built-in default.
  repeated string stun_servers = 5;
  // True when this central relays CALL_SIGNAL. Gates the Call button so
  // a client on an older central never rings into the void.
  bool call_signaling = 6;
  // True when this central serves the E2EE_* key endpoints. False (absent)
  // on an older central → the client sends plaintext DMs and hides the
  // encryption setup entirely.
  bool e2ee_keys = 7;
  // User statuses: true when this central understands SET_STATUS_REQ /
  // SET_IDLE_REQ (false on an older central → the client hides the
  // status menu). `status` is the user's saved choice, applied before
  // anyone was told this login happened.
  bool presence_statuses = 8;
  PresenceStatus status = 9;
  // The user's saved custom status message ('' / '' = none) and how many
  // seconds remain until central clears it (0 = never). Relative, so the
  // client's own timer doesn't depend on the two clocks agreeing.
  string status_text = 10;
  string status_emoji = 11;
  int64 status_clear_in = 12;
  // The account (users by uid, 2026-10-15): the uid every request and
  // payload now carries, and the username as stored.
  int64 uid = 13;
  string username = 14;
  // This central stores E2eeKeyBundle.binding and accepts rebinds
  // (E2eePublishKeysReq.rebind). Without it, clients publish name-bound
  // bundles and never rebind.
  bool e2ee_uid_binding = 15;
  // This central accepts RENAME_REQ (uid design, stage 5).
  bool renames = 16;
  // For LoginRequest.resume_token after a dropped connection: central-only
  // (never send it to a community, which wouldn't accept it anyway), valid
  // for 30 days from the password sign-in. A resume echoes it.
  string resume_token = 17;
  // The account's "only friends may DM me" setting. Central keeps it; the
  // client adopts it (OWN_PRESENCE carries later changes).
  bool dm_friends_only = 18;
  // Refused because the account is signed in on as many devices as it may
  // be (8). Signing in again works once one of them leaves; the client
  // doesn't fall back to the password for it.
  bool device_limit = 19;
}

// Change the signed-in account's username. Confirmed with the password;
// the name follows the registration rules. The old name stays reserved for
// this account for 14 days (it can rename back, and it still signs in with
// it), then anyone may take it. At most two renames per 24 hours.
message RenameRequest {
  string new_username = 1;
  string password = 2;
}
message RenameResponse {
  bool   success = 1;
  string message = 2;
  string username = 3;    // the account's name after the request
  string jwt_token = 4;   // success: a fresh token naming the new username
}
// A fresh 24 h token for the signed-in session.
message TokenRefreshRequest {}
message TokenRefreshResponse {
  bool   success = 1;
  string jwt_token = 2;
  string username = 3;   // the name the token carries
}
// A newer token for an authenticated community session (same uid, issued
// no earlier than the one it replaces). The community takes the name it
// carries (a rename) without a reconnect; the session's UDP key stays the
// one derived at auth.
message SessionTokenUpdate {
  string jwt_token = 1;
}

// To the account's watchers (PRESENCE_SUBSCRIBE) when it changes its name,
// invisible or not (owner decision). Clients hold people by uid, so the old
// name isn't sent: it would hand everyone the link.
message UserRenamed {
  int64  uid = 1;
  reserved 2;  // old_username
  string username = 3;
}

message DirectMessage {
  string sender = 1;
  string recipient = 2;
  string content = 3;
  int64 timestamp = 4;
  // Server-assigned persistence id, stamped by central after insertDm.
  // Old clients ignore the unknown field; new clients use it as the
  // `up_to_id` cursor in DmMarkReadReq.
  int64 id = 5;
  // Unix seconds of the last edit; 0 = never edited.
  int64 edited_at = 6;
  // Id of the DM this one replies to; 0 = not a reply.
  int64 reply_to = 7;
  // Embedded parent preview — see ChannelMessage.reply_to_sender/-content.
  // Empty sender with reply_to>0 = parent was deleted. Central cuts
  // reply_to_content to 512 bytes, ending in "…" when cut.
  string reply_to_sender = 8;
  string reply_to_content = 9;
  // Client-generated per send, echoed back unchanged (central copies
  // the packet it received into its echo) so the sender reconciles
  // its optimistic bubble; also set on central's error replies.
  string nonce = 10;
  // End-to-end encryption. When non-empty, `content` is only a fixed
  // placeholder for pre-E2EE clients and the real text is inside this
  // envelope (format: spec 2026-09-03 §Message envelope). Central stores
  // and relays it opaquely.
  bytes envelope = 11;
  // The reply parent's envelope, embedded by central like
  // reply_to_content — empty when the parent is a plaintext row.
  bytes reply_to_envelope = 12;
  // Users by uid (2026-10-15). sender_uid is central-stamped; a request
  // names the recipient by recipient_uid, or by name when it is 0.
  int64 sender_uid = 13;
  int64 recipient_uid = 14;
  int64 reply_to_sender_uid = 15;
  // Set when the reply parent has an envelope: the names it was sealed
  // under, which a v1 envelope binds (they can predate a rename).
  string reply_to_sealed_sender = 16;
  string reply_to_sealed_recipient = 17;
}

// A user's status. The chosen value is saved on central; AWAY is also
// what others see while an ONLINE user is idle. INVISIBLE never goes on
// the wire to other users: an invisible user is simply absent (offline).
enum PresenceStatus {
  PRESENCE_ONLINE    = 0;
  PRESENCE_AWAY      = 1;
  PRESENCE_DND       = 2;
  PRESENCE_INVISIBLE = 3;
}

message UserPresence {
  string username = 1;
  string avatar_version = 2;   // '' when no avatar set
  // Effective status: ONLINE, AWAY or DND (never INVISIBLE).
  PresenceStatus status = 3;
  // Custom status message; '' when none. Rides presence, so others see it
  // only while the user is visible (online, away or do not disturb).
  string status_text = 4;
  string status_emoji = 5;
  int64 uid = 6;
}

// The answer to a PRESENCE_SUBSCRIBE, for the accounts it newly watches:
// `covered_uids` lists them, `users` holds those visible right now (a
// covered uid without an entry is offline). Each entry carries the
// avatar_version, so clients see a changed avatar without polling.
// `avatars` gives the picture of every covered account not in `users`
// (offline, or invisible: the two look the same) that has one; a covered
// uid in neither list has no picture.
message PresenceUpdate {
  repeated UserPresence users = 1;
  repeated int64 covered_uids = 2;
  repeated AvatarVersion avatars = 3;
}

message AvatarVersion {
  int64 uid = 1;
  string version = 2;  // sha256-hex of the picture
}

// The full set of accounts the client is showing (friends, DM peers,
// member lists, profiles): PRESENCE_DELTA, USER_RENAMED, AVATAR_CHANGED
// and E2EE_KEYS_CHANGED for them reach this session; nothing else does
// (the account's own profile changes reach its other sessions anyway).
// Each request replaces the previous set. At most 5,000 uids (the rest are
// ignored).
message PresenceSubscribe {
  repeated int64 uids = 1;
}

// One user's presence changed: came online, went offline (or invisible),
// or changed status. Idempotent — always the user's full current state.
message PresenceDelta {
  UserPresence user = 1;
  bool online = 2;
}

// The user's chosen status. Central saves it and applies it at every login.
message SetStatusRequest {
  PresenceStatus status = 1;
}

// Auto-away: the client reports no input for its idle threshold (or a
// locked screen / sleep). Session-only; turns an ONLINE user AWAY.
message SetIdleRequest {
  bool idle = 1;
}

// The user's custom status message. Central normalises it (one line,
// trimmed, at most 128 characters; emoji at most 32 bytes), saves it, and
// clears it after `clear_after` seconds (0 = keep until changed, at most
// 7 days). Empty text and emoji clears it.
message SetStatusMessageRequest {
  string text = 1;
  string emoji = 2;
  int64 clear_after = 3;
}

// To every session of an account when its own state changes on any of
// them, or when the sweep clears its status message (multi-device). A
// device signing in gets the same in its LoginResponse instead.
message OwnPresence {
  PresenceStatus status = 1;       // the chosen one (INVISIBLE included)
  string status_text = 2;
  string status_emoji = 3;
  int64  status_clear_in = 4;      // seconds until central clears the message; 0 = never
  bool   dm_friends_only = 5;
  // Every device of the account is idle: others see an Online user as Away.
  bool   idle = 6;
}

// Client→community: while true, the community reports this member as
// offline in rosters (MemberInfo.is_online) even though connected.
message PresenceVisibility {
  bool hidden = 1;
}

message ServerListRequest {
}

message CommunityServerInfo {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string host_ip = 4;
  int32 port = 5;
  int32 member_count = 6;
  // sha256-hex of the server picture; '' when no picture is set.
  // Propagates through LoginResponse.memberships and
  // ServerListResponse.servers so clients know up-front which tiles
  // have a picture set.
  string picture_version = 7;
  // sha256-hex of the community's TLS certificate (DER), as reported in
  // its heartbeats. Clients pin the community connection to it — the
  // central connection is itself pinned (TOFU), so this is a trusted
  // channel for the fingerprint. '' = not reported yet (client falls
  // back to trust-on-first-use for that host).
  string cert_fingerprint = 8;
}

message ServerListResponse {
  repeated CommunityServerInfo servers = 1;
}

// --- Friend System Messages ---

enum FriendActionType {
  ADD = 0;
  REMOVE = 1;
  BLOCK = 2;
  ACCEPT = 3;
  REJECT = 4;
}

message FriendActionReq {
  FriendActionType action = 1;
  string target_username = 2;
  int64 target_uid = 3;  // preferred; target_username is the typed-name fallback
}

message FriendActionRes {
  bool success = 1;
  string message = 2;
}

message FriendInfo {
  string username = 1;
  enum Status {
    ONLINE = 0;
    OFFLINE = 1;
    PENDING_INCOMING = 2;
    PENDING_OUTGOING = 3;
    BLOCKED = 4;
  }
  Status status = 2;
  string avatar_version = 3;       // '' when no avatar set
  int64 uid = 4;
}

message FriendListReq {
}

message FriendListRes {
  repeated FriendInfo friends = 1;
}

// --- Community Server Messages ---

message ChannelInfo {
  string id = 1;
  string name = 2;
  // CATEGORY rows are grouping headers living in the same ordered list
  // as channels (Discord's flat model): a channel's category is the
  // nearest CATEGORY row above it in position order; channels before
  // the first category are uncategorized. Categories can't nest, carry
  // no messages, and ignore the retention/bitrate fields.
  enum Type { TEXT = 0; VOICE = 1; CATEGORY = 2; }
  Type type = 3;
  // Opus bitrate (kbps) for voice channels. 0 / unset means "use client default".
  int32 voice_bitrate_kbps = 4;
  // Per-channel retention in days. 0 = keep forever.
  // Text retention governs the message row itself; attachment retentions
  // soft-delete the attachment blob while leaving a tombstone row so the
  // client can render "file X was cleaned up after N days".
  int32 retention_days_text = 5;
  int32 retention_days_image = 6;
  int32 retention_days_video = 7;
  int32 retention_days_document = 8;
  int32 retention_days_audio = 9;
  // The RECIPIENT's resolved permissions for this channel (server-wide
  // role bits with the channel's overwrites applied; owner/ADMINISTRATOR
  // = everything). Channel lists are built per recipient and only
  // contain channels the recipient can VIEW_CHANNEL (categories are
  // always included). Clients gate composer / attach / voice-join /
  // history UI from this; the server stays authoritative.
  uint64 my_permissions = 10;
  // Minimum seconds between two messages from the same member in this
  // channel. 0 = off. MANAGE_MESSAGES holders bypass it.
  int32 slowmode_seconds = 11;
  // Text channels: end-to-end encrypted with member-held epoch keys. The
  // server refuses plaintext here (and envelopes elsewhere). Chosen when
  // the channel is created (ChannelCreateRequest.encrypted, default off)
  // and fixed for its life, so a channel's history is never mixed.
  bool encrypted = 12;
  // Follows its category's overwrites (permissions v3). Only ever true
  // under a category with category_sync on. Editing the channel's own
  // overwrites un-syncs it; CHANNEL_PERMISSIONS_SYNC_REQ re-syncs. Moves,
  // turning the category's sync off and deleting the category never
  // change what a channel allows: it keeps the rows it followed.
  bool permissions_synced = 13;
  // CATEGORY rows: whether channels can follow this category's
  // overwrites. Off (the default) = the category only groups channels.
  bool category_sync = 14;
  // Text channels: what the channel is for, shown next to its name in the
  // header. Plain text, ≤ 1024 bytes, "" = none. MANAGE_CHANNELS edits it.
  string topic = 15;
}

message CommunityAuthRequest {
  string jwt_token = 1;
  // Optional — when present, the user joins the server (consuming the invite)
  // as part of the same authentication handshake. Required for non-members.
  string invite_code = 2;
  // Invisible at connect time: start hidden, so the roster never shows
  // this member online (PRESENCE_VISIBILITY changes it later).
  bool presence_hidden = 3;
}

message CommunityAuthResponse {
  bool success = 1;
  string message = 2;
  repeated ChannelInfo channels = 3;
  // Membership failure reason code:
  //   ""               -> success
  //   "not_member"     -> user is not a member and did not supply an invite
  //   "invalid_invite" -> supplied invite is unknown, expired, or used up
  //   "banned"         -> user is banned from this server
  //   "auth"           -> JWT invalid
  string error_code = 4;
  // Server metadata (populated on success)
  string server_name = 5;
  string server_description = 6;
  string owner_username = 7;
  // Maximum attachment size (bytes) this server accepts per upload.
  // 0 means unlimited. Clients use this to pre-validate before sending the
  // init request; server enforces authoritatively.
  int64 max_attachment_bytes = 8;
  // Port for the HTTP attachment endpoint (upload/download). Typically
  // community server TCP port + 3. 0 means "feature not available".
  int32 attachment_port = 9;
  // Central-assigned community_servers.id, learned by the community via
  // SERVER_HEARTBEAT_RES. Lets a client that connected through an invite
  // (knowing only host:port) re-key the connection onto the same id the
  // central directory / memberships use, so the server doesn't exist
  // twice in the UI. 0 = not yet learned (client keeps its own key).
  int64 server_id = 10;
  // Whether this server is in the public directory + accepts invite-less
  // joins. Only actionable by MANAGE_SERVER holders (the settings toggle),
  // but sent to everyone so the state is consistent.
  bool public_listing = 11;
  int64 owner_uid = 12;   // users by uid (2026-10-15)
}

message ChannelMessage {
  string sender = 1;
  string channel_id = 2;
  string content = 3;
  int64 timestamp = 4;
  // Server-assigned monotonic id (used as pagination cursor and dedupe key).
  // Zero when a client is sending; server populates before broadcast + persist.
  int64 id = 5;
  // Attachments associated with this message. Ordered by position ASC.
  repeated Attachment attachments = 6;
  // Client-generated UUID for optimistic-bubble dedup. Server echoes
  // this back unchanged in the broadcast — never persisted. History pages
  // carry it on the requester's own messages from the last 30 minutes
  // (kept in the server's memory), so a client whose echo a reconnect
  // swallowed still matches the refetched row to its pending bubble;
  // empty on everything else.
  string nonce = 7;
  // Unix seconds of the last edit; 0 = never edited. Drives the "(edited)"
  // indicator. Set on history fetch and on CHANNEL_MESSAGE_EDITED.
  int64 edited_at = 8;
  // Id of the message this one replies to; 0 = not a reply. Persisted and
  // echoed on broadcast + history. The client renders a quoted preview by
  // resolving this id against its loaded messages.
  int64 reply_to = 9;
  // Embedded parent preview (Discord-style referenced message): the parent's
  // author + content, resolved server-side on broadcast and history so the
  // client can render the quoted preview even when the parent is far outside
  // the loaded window. Empty sender with reply_to>0 = parent was deleted.
  string reply_to_sender = 10;
  string reply_to_content = 11;
  // Kinds (Attachment.Kind) of the parent's attachments, in position order —
  // lets the client label an attachment-only parent ("Image", "Video", …)
  // without having it loaded. Empty when the parent has none.
  repeated int32 reply_to_attachment_kinds = 12;
  // Encrypted channels: the sealed body (spec 2026-09-04 §Message
  // envelope); `content` is then a fixed placeholder for old clients.
  // Server-populated reply_to_envelope mirrors reply_to_content.
  bytes envelope = 13;
  bytes reply_to_envelope = 14;
  // The sender lacked EMBED_LINKS in this channel when sending (or last
  // editing): clients render no link-preview / GIF media for it.
  bool suppress_embeds = 15;
  // Users by uid (2026-10-15). `sender` is the current name; a row with an
  // envelope also carries the name it was sealed under (a v1 envelope binds
  // it), which can predate a rename.
  int64 sender_uid = 16;
  int64 reply_to_sender_uid = 17;
  string sealed_sender = 18;
  string reply_to_sealed_sender = 19;
}

message Attachment {
  // Attachment kind — aligns with retention_days_{image,video,document,audio}.
  enum Kind {
    IMAGE = 0;
    VIDEO = 1;
    DOCUMENT = 2;
    AUDIO = 3;
  }
  int64 id = 1;
  int64 message_id = 2;
  Kind kind = 3;
  string filename = 4;
  string mime = 5;
  int64 size_bytes = 6;
  // Relative URL or storage identifier; empty when the attachment has been
  // purged by retention (tombstone row preserved for client rendering).
  string url = 7;
  int32 position = 8;
  int64 created_at = 9;
  // 0 = still present. Nonzero = unix seconds when retention removed the blob.
  int64 purged_at = 10;
  // Intrinsic pixel dimensions for image/video attachments. 0 = unknown
  // (older row or non-image kind). Clients use these to reserve the right
  // amount of space on first render so the data URL loading in later
  // doesn't cause a layout shift.
  uint32 width = 11;
  uint32 height = 12;
  // Total bytes across all server-stored JPEG thumbnails for this
  // attachment. 0 = no thumbnails (audio/document, or pre-thumbnail
  // upload). Clients use the presence (>0) to know whether to lazy-
  // fetch via GET /attachments/:id?variant=thumb[&size=N].
  uint32 thumbnail_size_bytes = 13;
  // Bitmask of pre-generated thumbnail sizes that exist on the server.
  // bit 0 = 320 px long-edge, bit 1 = 640 px, bit 2 = 1280 px. 0 with
  // thumbnail_size_bytes > 0 means a legacy single-size upload (320 px,
  // served from .thumb.jpg without the new naming).
  uint32 thumbnail_sizes_mask = 14;
  // Duration in milliseconds for audio + video attachments. Read at
  // upload time client-side and shipped in /attachments/init so chat
  // UIs can show "0:00 / 3:45" before the file is downloaded. 0 =
  // unknown (legacy row, non-media kind, or extraction failed).
  uint32 duration_ms = 15;
  // ThumbHash placeholder for image/video attachments — ~25 opaque
  // bytes the uploader computes from the same decoded bitmap it makes
  // thumbnails from, shipped in /attachments/init. The server never
  // interprets it; it stores and echoes the blob.
  //
  // Lets a viewer paint a blurred preview of the image with *zero*
  // requests, so a message scrolling into view is never an empty box.
  // Prefetching (client-side) covers rows near the viewport; this
  // covers the cases it can't — the first screen of a channel, and a
  // fling that outruns the prefetch window.
  //
  // Empty = unavailable: a pre-thumbhash upload, a non-image kind, or
  // an encoder failure. Clients fall back to a flat surface fill.
  //
  // Carried as base64 rather than `bytes` so it stays opaque the whole
  // way: the community server and the native client both move it as a
  // plain string with no codec dependency, and only the renderer — the
  // one place that decodes it — needs to know the format. ~34 bytes on
  // the wire instead of 25, which is not worth a base64 implementation
  // in two more languages.
  string placeholder = 16;
  // Encrypted channels (spec 2026-09-04 §Attachments): the stored bytes
  // are the uploader's ciphertext (64 KiB AES-256-GCM chunks) and the
  // thumbnails are sealed JPEGs; filename / mime / dimensions / placeholder
  // here are opaque stand-ins. The real metadata and the key travel inside
  // the message envelope (EncryptedMessageBody). The server only keeps the
  // flag so the wire format follows the channel flag.
  bool encrypted = 17;
}

// --- Channel management ---
// The channel `id` is a server-generated slug of the name (unique,
// filesystem-safe — it doubles as the attachment directory name) and is
// immutable; renames change only the display name.

message ChannelCreateRequest {
  string name = 1;
  ChannelInfo.Type type = 2;
  // Voice channels only. 0 = "use client default".
  int32 voice_bitrate_kbps = 3;
  // Where the new channel lands: the id of an existing CATEGORY row to
  // append inside (end of its block), or "" to append at the end of
  // the uncategorized area (before the first category). Ignored when
  // creating a category — categories always append at the very end.
  string category_id = 4;
  // Text channels: end-to-end encrypted for good (ChannelInfo.encrypted).
  // Ignored for voice channels and categories.
  bool encrypted = 5;
}

message ChannelDeleteRequest {
  string channel_id = 1;
}

message ChannelRenameRequest {
  string channel_id = 1;
  string name = 2;
}

message ChannelActionResponse {
  bool success = 1;
  string message = 2;
  // "create" | "rename" | "delete"
  string action = 3;
  // Populated on successful create/rename.
  ChannelInfo channel = 4;
}

// Full ordered channel list, pushed to every member after any create /
// rename / delete so sidebars stay authoritative without a reconnect.
// Clients replace their local list wholesale (and drop cached state for
// channels that disappeared).
message ChannelListUpdate {
  repeated ChannelInfo channels = 1;
}

// The complete new sidebar order (channels + categories, one flat
// list) after a drag-reorder. The id set must exactly match the
// server's current channel set — the server rewrites positions 0..N-1
// in one transaction and pushes CHANNEL_LIST_UPDATE, so a concurrent
// create/delete makes the reorder fail cleanly instead of silently
// dropping rows.
message ChannelReorderRequest {
  repeated string channel_ids = 1;
}

// Sets (or clears, with an empty nickname) a member's display nickname.
// Self-changes need CHANGE_NICKNAME; changing someone else's requires
// MANAGE_NICKNAMES and a strictly higher role (or a peer, see
// RoleInfo.manage_each_other). Result rides
// MOD_ACTION_RES with action="nickname".
message SetNicknameRequest {
  string username = 1;
  string nickname = 2;
  int64 uid = 3;   // preferred over username
}

// --- Per-channel permission overwrites ---
// Discord's model: an overwrite per (channel, role | member) with an allow
// and a deny bitfield. Resolution: base server permissions → @everyone
// overwrite → OR of role overwrites → member overwrite; owner and
// ADMINISTRATOR bypass overwrites; a result without VIEW_CHANNEL is 0.
message ChannelOverwrite {
  string channel_id = 1;
  enum TargetType { ROLE = 0; MEMBER = 1; }
  TargetType target_type = 2;
  // Role id (decimal string) for ROLE, username for MEMBER.
  string target_id = 3;
  uint64 allow = 4;
  uint64 deny = 5;
  // Member rows: the member's uid (preferred in requests); target_id then
  // carries their current name.
  int64 target_uid = 6;
}

// Sets (or, with allow = deny = 0, removes) one overwrite. Requires
// MANAGE_ROLES in the channel; only bits the actor holds in that channel
// may be changed; role targets must sit strictly below the actor's level.
// Result rides CHANNEL_ACTION_RES with action="overwrite".
message ChannelOverwriteSetRequest {
  ChannelOverwrite overwrite = 1;
}

message ChannelOverwritesRequest {
  string channel_id = 1;
}

// Drops the channel's own overwrites so it follows its category again.
// MANAGE_ROLES in the channel; every bit that changes must be one the
// actor holds there; the category must have category_sync on. A CATEGORY
// id syncs every channel under it that isn't synced yet. See the
// permissions v3 spec.
message ChannelPermissionsSyncRequest {
  string channel_id = 1;
  // The category the user agreed to sync with (e.g. right after dragging
  // the channel into it). Refused if the channel is in another one by the
  // time this lands, so a failed / raced reorder can't sync it with its
  // old category. Empty = no check.
  string category_id = 2;
}

message CategorySyncSetRequest {
  string channel_id = 1;   // a CATEGORY
  bool enabled = 2;
}

// For a channel synced to its category (ChannelInfo.permissions_synced)
// `overwrites` are the category's rows: what actually applies.
message ChannelOverwritesResponse {
  bool success = 1;
  string message = 2;
  string channel_id = 3;
  repeated ChannelOverwrite overwrites = 4;
}

message ChannelHistoryRequest {
  string channel_id = 1;
  // Return messages with id < before_id. 0 means "most recent".
  int64 before_id = 2;
  // Server-enforced cap (hard max regardless of client value).
  int32 limit = 3;
  // Jump-to-message: fetch a window centered on this id (up to `limit` before
  // and after). Takes precedence over before_id/after_id. 0 = unused.
  int64 around_id = 4;
  // Downward pagination: fetch messages with id > after_id (oldest first).
  // 0 = unused.
  int64 after_id = 5;
}

message ChannelHistoryResponse {
  string channel_id = 1;
  // Ordered from oldest to newest within the page.
  repeated ChannelMessage messages = 2;
  // True when more messages exist older than the oldest one returned.
  bool has_more = 3;
  // True when more messages exist newer than the newest one returned. Always
  // false for a plain "most recent" page (the newest is loaded). Meaningful
  // after an around/after fetch — drives the "jump to present" affordance.
  bool has_more_after = 4;
  // Echoed from the request so the client applies the page correctly:
  // around_id>0 → this is a context window (replace); after_id>0 → newer page
  // (append); both 0 → older page (prepend) / most-recent.
  int64 around_id = 5;
  int64 after_id = 6;
  // Echoed too (review B4): all three 0 marks the channel's newest page, which
  // answers for everything from its oldest row up (the byte budget only cuts
  // the far end), so a row the client holds above it was deleted, and an empty
  // newest page means an empty channel.
  int64 before_id = 7;
}

message ChannelUpdateRequest {
  string channel_id = 1;
  // All five retention values — client sends the full snapshot. 0 = forever.
  int32 retention_days_text = 2;
  int32 retention_days_image = 3;
  int32 retention_days_video = 4;
  int32 retention_days_document = 5;
  int32 retention_days_audio = 6;
  // Voice channels only: Opus bitrate in kbps, 0 = "use client
  // default". `optional` for explicit presence — absent (older
  // clients / text-channel updates) means "leave unchanged", so a
  // retention-only update can never silently reset the bitrate.
  // Applied by clients on their next voice join.
  optional int32 voice_bitrate_kbps = 7;
  // Text channels: slowmode in seconds (0 = off), clamped to [0, 21600].
  // Absent = leave unchanged.
  optional int32 slowmode_seconds = 8;
  // Was the encryption on/off switch. Encryption is chosen at creation
  // (ChannelCreateRequest.encrypted) and can't change.
  reserved 9;
  // Text channels: the topic (clamped to 1024 bytes, "" clears it).
  // Absent = leave unchanged.
  optional string topic = 10;
}

message ChannelUpdateResponse {
  bool success = 1;
  string message = 2;
  // Echo of the updated channel so clients can refresh their local copy.
  ChannelInfo channel = 3;
}

message AttachmentTombstone {
  int64 attachment_id = 1;
  int64 purged_at = 2;
}

message ChannelPruned {
  string channel_id = 1;
  // Message rows fully removed by text retention or a ban's message purge
  // (one packet per batch of ids, never one per message).
  repeated int64 deleted_message_ids = 2;
  // Attachments soft-deleted into tombstones (blob gone, metadata retained).
  repeated AttachmentTombstone purged_attachments = 3;
}

// Owner-initiated full wipe of a channel's history. Sent by the
// requesting client; the server validates ownership before acting.
message ChannelWipeRequest {
  string channel_id = 1;
}

// Reply to the requesting client only. Counts let the UI show
// confirmation feedback without re-fetching history.
message ChannelWipeResponse {
  bool success = 1;
  string message = 2;
  string channel_id = 3;
  int64 deleted_message_count = 4;
  int64 deleted_attachment_count = 5;
}

// Broadcast to every authenticated session after a successful wipe.
// Lets clients drop the channel's locally-cached message state without
// shipping every deleted message id over the wire.
message ChannelWiped {
  string channel_id = 1;
  // Wall-clock unix seconds when the wipe completed.
  int64 wiped_at = 2;
  string wiped_by = 3;
  int64 wiped_by_uid = 4;
}

message JoinVoiceRequest {
  string channel_id = 1;
  // Capabilities of the joining client. Empty when sent by an older
  // client that pre-dates negotiation; server treats that as "H.264
  // decode/encode only, conservative ceilings" for back-compat.
  ClientCapabilities capabilities = 2;
}

message LeaveVoiceRequest {
}

message VoiceUserState {
  string username = 1;
  bool is_muted = 2;
  bool is_deafened = 3;
  // Moderator-applied (VOICE_MOD_REQ), persisted on the member: a
  // server-muted user's audio is dropped by the relay; a server-deafened
  // user receives no audio (and is implicitly muted).
  bool is_server_muted = 4;
  bool is_server_deafened = 5;
  // Lacks SPEAK in this channel: the relay drops their voice audio.
  bool is_suppressed = 6;
  int64 uid = 7;
}

message VoicePresenceUpdate {
  string channel_id = 1;
  repeated string active_users = 2;
  repeated VoiceUserState user_states = 3;
  // Parallel to user_states/active_users — same length, same order.
  // user_capabilities[i] belongs to active_users[i].
  repeated ClientCapabilities user_capabilities = 4;
  repeated int64 active_uids = 5;   // parallel to active_users
}

message VoiceStateNotify {
  bool is_muted = 1;
  bool is_deafened = 2;
}

message VideoStreamInfo {
  string stream_id = 1;
  string owner_username = 2;
  bool has_audio = 3;
  uint32 resolution_width = 4;
  uint32 resolution_height = 5;
  uint32 fps = 6;
  // Live current codec. Changes mid-stream when the streamer renegotiates.
  VideoCodec current_codec = 7;
  // CODEC_UNKNOWN if the streamer chose Auto. Drives the lock badge
  // and the grayed-out watch button.
  VideoCodec enforced_codec = 8;
  // Number of watchers currently subscribed to this stream. Derived from the
  // server's stream_watchers_ set on each presence broadcast; defaults to 0 for
  // old clients/servers.
  uint32 watcher_count = 9;
  int64 owner_uid = 10;
}

message StreamPresenceUpdate {
  string channel_id = 1;
  repeated VideoStreamInfo active_streams = 2;
}

message StartStreamRequest {
  string channel_id = 1;
  int32 target_fps = 2;
  int32 target_bitrate_kbps = 3;
  bool has_audio = 4;
  uint32 resolution_width = 5;
  uint32 resolution_height = 6;
  // Codec the streamer is starting with. Auto-picked from the streamer's
  // encode caps (filtered by user toggles) when enforced_codec is UNKNOWN.
  VideoCodec chosen_codec = 7;
  // CODEC_UNKNOWN = no enforcement, auto-negotiation enabled.
  // Anything else = streamer locks the stream to this codec; viewers
  // without it see a grayed-out watch button (computed locally).
  VideoCodec enforced_codec = 8;
}

message StopStreamRequest {
  string channel_id = 1;
}

message WatchStreamRequest {
  string channel_id = 1;
  string target_username = 2;
  int64 target_uid = 3;   // preferred over target_username
}

message StopWatchingRequest {
  string channel_id = 1;
  string target_username = 2;
  int64 target_uid = 3;   // preferred over target_username
}

message StreamThumbnailUpdate {
  string channel_id = 1;
  string owner_username = 2;
  bytes thumbnail_data = 3;
  int64 owner_uid = 4;
}

message DmPrivacySetting {
  bool friends_only = 1;
}

message ServerHeartbeat {
  string name = 1;
  string description = 2;
  string host_ip = 3;
  int32 port = 4;
  int32 member_count = 5;
  // The central-assigned id this community learned from an earlier
  // SERVER_HEARTBEAT_RES (cached in its DB across restarts); 0 = unknown.
  // Lets central keep the SAME row (and every user_communities membership)
  // when the community's public IP or port changes, instead of creating a
  // new (host_ip, port) row and orphaning the old memberships.
  int64 server_id = 6;
  // sha256-hex of this community's TLS certificate (DER). Central stores
  // it and hands it to clients so they can pin the community connection.
  string cert_fingerprint = 7;
  // When true the community opts into the public directory (discovery list)
  // and accepts invite-less joins; when false central hides it from the
  // directory and it stays invite-only. Owner-controlled, DB source of truth.
  bool public_listing = 8;
}

// --- Invites + Membership ---

message InviteInfo {
  string code = 1;
  string created_by = 2;
  int64 created_at = 3;
  int64 expires_at = 4;     // 0 = never
  int32 max_uses = 5;       // 0 = unlimited
  int32 uses = 6;
  // Personal invite: only this user can redeem it ("" = anyone).
  string for_user = 7;
  int64 created_by_uid = 8;
  int64 for_uid = 9;
}

message InviteCreateRequest {
  // 0 means "never"
  int64 expires_at = 1;
  // 0 means "unlimited"
  int32 max_uses = 2;
  // Personal invite for one user (the welcome banner's "Invite friends").
  // Always single-use; refused when they're already a member; a live
  // personal invite from the same creator for the same user is returned
  // instead of a new one.
  string for_user = 3;
  // Echoed on the response so the client can match it to this request.
  uint32 request_id = 4;
  int64 for_uid = 5;   // preferred over for_user
}

message InviteCreateResponse {
  bool success = 1;
  string message = 2;
  InviteInfo invite = 3;
  uint32 request_id = 4;
  // A personal invite was refused because for_user is already a member.
  // The Invite friends picker filters against the roster it has loaded,
  // which may lack offline members; this tells it which rows to mark.
  bool already_member = 5;
}

// The welcome banner's "Invite friends" lists friends who aren't members yet.
// Central answers from its own membership table, so the friend list never
// reaches the community (owner rule), and only for a community the caller is
// a member of: what it reveals is the caller's mutual communities with their
// friends, which the community's own member list shows them anyway.
message FriendsInCommunityRequest {
  int64 server_id = 1;   // central's community id
}
message FriendsInCommunityResponse {
  int64 server_id = 1;             // echoed
  bool  success = 2;               // false: not a member of it, or the database failed
  repeated int64 member_uids = 3;  // the caller's (accepted) friends who are members
}

message InviteListRequest {}

message InviteListResponse {
  bool success = 1;
  string message = 2;
  // Newest first.
  repeated InviteInfo invites = 3;
  // Only the newest invites fit the reply (a byte budget under the
  // client's frame cap); older ones exist but aren't listed.
  bool truncated = 4;
}

message InviteRevokeRequest {
  string code = 1;
}

message InviteRevokeResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
}

message MemberInfo {
  string username = 1;
  int64 joined_at = 2;
  string nickname = 3;
  bool is_owner = 4;
  bool is_online = 5;
  // Ids of the roles assigned to this member (the default `everyone`
  // role is implicit and never listed). Clients resolve them against
  // RoleListResponse to compute display color and permissions. Deleting a
  // role sends no MEMBER_UPSERT for its holders: the ROLE_LIST_RES that
  // follows no longer names it, and clients drop its id from every member
  // they hold.
  repeated int64 role_ids = 6;
  // Unix seconds until which the member is timed out (can't send, join
  // voice or stream). 0 = not timed out.
  int64 timed_out_until = 7;
  int64 uid = 8;
}

// --- Roster protocol ---
// The roster used to be one MEMBER_LIST_RES snapshot, re-pushed to every
// session on every join / leave / nickname / role change: O(members ×
// online) bytes per event, the first thing that falls over past a few
// hundred members. Now:
//   * MEMBER_LIST_REQ is a PAGED snapshot the client fetches on demand.
//     Pages run through one sequence: every online member, then every
//     offline member, each part in roster order (below). A page holds at
//     most `limit` members and may cross from the online part into the
//     offline part. Every page carries the whole server's counts
//     (online_count, total_members), so the sidebar's headers are right
//     while only part of the list is loaded, and the first page carries
//     the requester's own row. Clients show the loaded stretch of each
//     part and load more as the sidebar scrolls.
//   * A lookup (MemberListRequest.uids) fetches named members wherever
//     they sort, for views that show someone the pages haven't reached
//     (a message author, a voice participant, a profile).
//   * Live changes arrive as MEMBER_UPSERT (join, nickname, roles,
//     online/offline flip — carries the full MemberInfo) and
//     MEMBER_REMOVE (leave / kick / ban), each with the counts after the
//     change. O(online) per event. Every session gets every delta,
//     whether it has loaded that member or not; a client keeps the row
//     but shows it only once its place is inside the loaded stretch.
//   * Every roster packet carries `revision`, a per-server-process
//     counter incremented on each change. A client that sees a gap
//     (delta.revision != last + 1) missed something and re-fetches page 1.
//   * Bans are their own list (BAN_LIST_REQ/RES), sent only to
//     BAN_MEMBERS holders, pushed on change.
// Roster order (the sidebar's; clients mirror it exactly): the display
// name — the nickname, else the username — folded as message search
// folds text (lower case, accents removed, dotless ı as i: search.cpp
// search_fold) and compared in code point order; then the display name
// itself in code point order; then the uid. Which part a member is in
// follows MemberInfo.is_online.
message MemberListRequest {
  // Opaque cursor: "" for the first page, else next_after of the page
  // before.
  string after = 1;
  // Members per page; server clamps to [1, 1000], default 100. A page can
  // stop short of it to stay under the frame cap (has_more says so).
  int32 limit = 2;
  // A lookup instead of a page (at most 200 uids; the rest are ignored):
  // the reply's `extra` holds those of them that are members and
  // `lookup_uids` echoes them; `after` and `limit` are ignored, and the
  // reply's page fields (members, has_more, next_after, first_page,
  // online_complete) are unset.
  repeated int64 uids = 3;
}

message MemberListResponse {
  bool success = 1;
  string message = 2;
  // The page in sequence order: online members first while any remain
  // past the cursor, then offline members.
  repeated MemberInfo members = 3;
  reserved 4;
  reserved "bans";
  uint64 revision = 5;
  // Members in the whole server (online + offline), loaded or not.
  int64 total_members = 6;
  bool has_more = 7;
  string next_after = 8;
  // True when the request's `after` was "" (and it wasn't a lookup).
  bool first_page = 9;
  // Members shown online right now (MemberInfo.is_online) in the whole
  // server, loaded or not.
  int64 online_count = 10;
  // True once the pages up to and including this one hold every online
  // member: `members` ends the online part and may go on into the offline
  // part. While false, every member of the page is online and more online
  // members follow.
  bool online_complete = 11;
  // Rows outside the sequence: on a first page, the requester's own row
  // when `members` doesn't hold it; on a lookup, the requested uids that
  // are members.
  repeated MemberInfo extra = 12;
  // A lookup's reply only: the uids it asked for (those missing from
  // `extra` aren't members). A refused lookup (success false, e.g. rate
  // limited) echoes them too.
  repeated int64 lookup_uids = 13;
}

// Settings-screen search over the whole membership. Matches are every
// member whose username or nickname contains `query` (case-insensitive
// for ASCII; "" matches everyone) and, with role_id set, who hold that
// role. Ordered by username, online or not, paged by `after`.
message MemberSearchRequest {
  string query = 1;
  // 0 = any role; > 0 = holds that role; -1 = holds no role at all.
  int64 role_id = 2;
  // Opaque cursor: "" for the first page, else next_after.
  string after = 3;
  // Server clamps to [1, 200], default 100.
  int32 limit = 4;
  // Echoed back so the client can drop answers to superseded searches.
  uint32 seq = 5;
}

message MemberSearchResponse {
  bool success = 1;
  string message = 2;
  repeated MemberInfo members = 3;
  // Matches across all pages.
  int64 total_matches = 4;
  bool has_more = 5;
  string next_after = 6;
  uint32 seq = 7;
  // True when the request's `after` was "".
  bool first_page = 8;
}

// Message search (spec 2026-10-14). Every filter that is set narrows the
// results. At least one of query / author_uids / has / after / before /
// channel_ids must be set. Text channels only; a future thread is a channel
// of its own, so scoping stays a list of channel ids.
message MessageSearchRequest {
  // Echoed back so the client can drop answers to superseded searches.
  uint32 seq = 1;
  // Free text (<= 512 bytes): words, "exact phrases", -excluded words.
  // Words of 3+ characters match as prefixes; case and accents are
  // ignored; attachment file names match too. Encrypted channels' text is
  // never searched (their ids come back in text_skipped_channel_ids).
  string query = 2;
  // Text channels to search; empty = every one the requester can read
  // (VIEW_CHANNEL + READ_HISTORY). Others are dropped silently. <= 100.
  repeated string channel_ids = 3;
  reserved 4;  // authors: senders by name (users by uid: author_uids only)
  // Unix seconds: after is inclusive, before exclusive; 0 = unbounded.
  int64 after = 5;
  int64 before = 6;
  // Each set bit must hold.
  enum Has {
    HAS_NONE = 0;
    HAS_FILE = 1;       // any attachment
    HAS_IMAGE = 2;
    HAS_VIDEO = 4;
    HAS_AUDIO = 8;
    HAS_DOCUMENT = 16;
    HAS_LINK = 32;      // an http(s) link in the text (plaintext channels)
  }
  uint32 has = 7;       // bitwise OR of Has values
  enum Sort {
    NEWEST = 0;
    OLDEST = 1;
    RELEVANCE = 2;      // needs query words; otherwise NEWEST
  }
  Sort sort = 8;
  // NEWEST / OLDEST paging: next_cursor of the previous page; 0 = first.
  int64 cursor = 9;
  // RELEVANCE paging: next_offset of the previous page; 0 = first.
  int32 offset = 10;
  // Server clamps to [1, 50], default 25.
  int32 limit = 11;
  // Match the query's words and "phrases" anywhere inside words ("abc"
  // finds "xabcy"), case- and accent-insensitive, punctuation kept. A scan
  // of the text rather than an index lookup, so it's slower on a big
  // server; RELEVANCE then sorts as NEWEST.
  bool match_within_words = 12;
  // Senders (<= 10): each matches every message their account sent, under
  // any name.
  repeated int64 author_uids = 13;
}

message MessageSearchResponse {
  uint32 seq = 1;
  bool success = 2;
  // Why it failed (user-facing): rate limited, busy, too broad, …
  string message = 3;
  // The page, in sort order. Encrypted channels' rows carry their envelope
  // as in history.
  repeated ChannelMessage messages = 4;
  bool has_more = 5;
  int64 next_cursor = 6;
  int32 next_offset = 7;
  // First page only: matches counted; -1 = not counted.
  int64 total = 8;
  // More than `total` match (count cap or time budget reached).
  bool total_capped = 9;
  // Encrypted channels in scope whose text couldn't be searched (set when
  // the request had words or HAS_LINK).
  repeated string text_skipped_channel_ids = 10;
  // The time budget ran out before the page filled; what was found so far.
  bool partial = 11;
  // Rate limited or busy: retry after this many milliseconds.
  int32 retry_after_ms = 12;
  // True when the request's cursor and offset were 0.
  bool first_page = 13;
}

message MemberUpsert {
  MemberInfo member = 1;
  uint64 revision = 2;
  // The whole server's counts after this change (as in
  // MemberListResponse), right for members the client hasn't loaded too.
  int64 online_count = 3;
  int64 total_members = 4;
}

message MemberRemove {
  string username = 1;
  uint64 revision = 2;
  int64 uid = 3;
  // The whole server's counts after this change.
  int64 online_count = 4;
  int64 total_members = 5;
}

message BanListRequest {}

message BanListResponse {
  bool success = 1;
  string message = 2;
  reserved 3;
  reserved "bans";
  uint64 revision = 4;
  // Newest first.
  repeated BanInfo entries = 5;
  // Only the newest bans fit the reply (a byte budget under the client's
  // frame cap); older ones exist but aren't listed.
  bool truncated = 6;
}

// --- Roles + permissions ---
// RoleInfo.permissions is an OR of these bit values. The values are part
// of the wire contract — never renumber, only append new bits. Bits kept
// below 2^53 so JavaScript clients can treat the field as a plain number.
//
// Semantics:
//   PERM_ADMINISTRATOR grants everything below (but NOT hierarchy bypass:
//   role management and kick/ban still require the actor's highest role
//   to sit above the role/member being acted on; only the owner bypasses
//   hierarchy).
//   Every bit is enforced server-side. Channel-scoped bits (VIEW, READ,
//   SEND, ATTACH, EMBED, CONNECT, SPEAK, STREAM, MUTE/DEAFEN/MOVE,
//   MANAGE_CHANNELS/MESSAGES/ROLES) resolve through per-channel
//   overwrites; the rest are server-wide.
enum Permission {
  PERM_NONE             = 0;
  PERM_ADMINISTRATOR    = 1;     // 1<<0  — all permissions
  PERM_MANAGE_SERVER    = 2;     // 1<<1  — server name/description/picture
  PERM_MANAGE_CHANNELS  = 4;     // 1<<2  — retention settings, wipe (create/delete later)
  PERM_MANAGE_ROLES     = 8;     // 1<<3  — create/edit/delete/assign roles below own highest
  PERM_KICK_MEMBERS     = 16;    // 1<<4
  PERM_BAN_MEMBERS      = 32;    // 1<<5  — ban/unban + see the ban list
  PERM_MANAGE_MESSAGES  = 64;    // 1<<6  — delete other members' messages
  PERM_MANAGE_INVITES   = 128;   // 1<<7  — list/revoke everyone's invites (implies create)
  PERM_MANAGE_NICKNAMES = 256;   // 1<<8  — change other members' nicknames
  PERM_SEND_MESSAGES    = 1024;  // 1<<10 — post in a text channel (enforced since v2)
  PERM_CONNECT_VOICE    = 2048;  // 1<<11 — join a voice channel (enforced since v2)
  PERM_STREAM           = 4096;  // 1<<12 — start a screen share (enforced since v2)
  // --- permissions v2 (per-channel overwrites) ---
  PERM_VIEW_CHANNEL     = 8192;  // 1<<13 — channel is listed / its traffic delivered
  PERM_READ_HISTORY     = 16384; // 1<<14 — CHANNEL_HISTORY_REQ
  PERM_ATTACH_FILES     = 32768; // 1<<15 — attachments on messages / upload init
  // --- server management + moderation ---
  PERM_VIEW_AUDIT_LOG   = 65536;  // 1<<16
  PERM_MODERATE_MEMBERS = 131072; // 1<<17 — timeouts
  // --- permissions v3 ---
  PERM_MUTE_MEMBERS     = 262144;   // 1<<18 — server mute (was VOICE_MODERATE)
  PERM_DEAFEN_MEMBERS   = 524288;   // 1<<19 — server deafen
  PERM_MOVE_MEMBERS     = 1048576;  // 1<<20 — move / disconnect from voice
  PERM_CREATE_INVITE    = 2097152;  // 1<<21 — create invites; list/revoke own
  PERM_CHANGE_NICKNAME  = 4194304;  // 1<<22 — set own nickname
  PERM_EMBED_LINKS      = 8388608;  // 1<<23 — link previews on own messages
  PERM_SPEAK            = 16777216; // 1<<24 — voice audio is relayed
}

message RoleInfo {
  int64 id = 1;
  string name = 2;
  // 0xRRGGBB display color; 0 = default (no color).
  uint32 color = 3;
  // Dense hierarchy position, higher = more senior. 0 is reserved for
  // the default `everyone` role; real roles occupy 1..N with no gaps.
  int32 position = 4;
  uint64 permissions = 5;
  // True only for the seeded `everyone` role: undeletable, unmovable,
  // implicit on every member; only its permissions (and
  // manage_each_other) can be edited.
  bool is_default = 6;
  // Members whose HIGHEST role is this one may manage each other:
  // nicknames and voice moderation (with the matching permission bit).
  // Never kick / ban / timeout / role changes — those stay strictly
  // above-only.
  bool manage_each_other = 7;
  // Members holding the role (every member for `everyone`). Filled in
  // role-list pushes, which go out again whenever a count changes.
  int64 member_count = 8;
}

message RoleListRequest {}

message RoleListResponse {
  bool success = 1;
  string message = 2;
  // Ordered most-senior first (position DESC); `everyone` last.
  repeated RoleInfo roles = 3;
}

message RoleCreateRequest {
  string name = 1;
  uint32 color = 2;
  uint64 permissions = 3;
  // New roles are always inserted at position 1 (just above `everyone`);
  // move them afterwards with RoleUpdateRequest.position.
  bool manage_each_other = 4;
}

// Full snapshot — the client sends every field (it has the current role
// from RoleListResponse). position is clamped server-side to [1, N] and
// to strictly below the actor's own highest role.
message RoleUpdateRequest {
  int64 role_id = 1;
  string name = 2;
  uint32 color = 3;
  uint64 permissions = 4;
  int32 position = 5;
  bool manage_each_other = 6;
}

message RoleDeleteRequest {
  int64 role_id = 1;
}

message RoleActionResponse {
  bool success = 1;
  string message = 2;
  // "create" | "update" | "delete" | "assign"
  string action = 3;
  // Populated on successful create/update so the requester can resolve
  // the server-assigned id without waiting for the ROLE_LIST_RES push.
  RoleInfo role = 4;
}

// Replaces the target member's entire role set (the default role is
// implicit and must not be listed). Requires MANAGE_ROLES, and every
// role being added or removed must sit strictly below the actor's
// highest role.
message MemberRolesUpdateRequest {
  string username = 1;
  repeated int64 role_ids = 2;
  int64 uid = 3;   // preferred over username
}

message UnbanMemberRequest {
  string username = 1;
  int64 uid = 2;   // preferred over username
}

message KickMemberRequest {
  string username = 1;
  string reason = 2;
  int64 uid = 3;   // preferred over username
}

message BanMemberRequest {
  string username = 1;
  string reason = 2;
  // Unix seconds when the ban lifts itself; 0 = permanent.
  int64 expires_at = 3;
  // Also delete the member's messages from the last N seconds
  // (0 = none; clamped to 7 days). Each deletion is broadcast as
  // CHANNEL_MESSAGE_DELETED to the channel's viewers.
  int32 delete_message_seconds = 4;
  int64 uid = 5;   // preferred over username
}

message BanInfo {
  string username = 1;
  string banned_by = 2;
  string reason = 3;
  int64 banned_at = 4;
  int64 expires_at = 5;   // 0 = permanent
  int64 uid = 6;
  int64 banned_by_uid = 7;
}

message ModActionResponse {
  bool success = 1;
  string message = 2;
  // Echo of the username that was acted upon, so the client can resolve
  // which request this response corresponds to.
  string username = 3;
  // "kick" | "ban" | "unban" | "leave"
  string action = 4;
  int64 uid = 5;
}

message LeaveServerRequest {}

message ServerMetaUpdate {
  string server_name = 1;
  string server_description = 2;
  string owner_username = 3;
  bool public_listing = 4;
  int64 owner_uid = 5;
}

message MembershipRevoked {
  // "kick" | "ban" | "leave"
  string action = 1;
  string reason = 2;
  string actor = 3;
  // Bans only: when the ban lifts (0 = permanent).
  int64 expires_at = 4;
  int64 actor_uid = 5;
}

// --- Server management + moderation ---

message ServerUpdateRequest {
  string name = 1;          // ≤ 64 bytes, non-empty
  string description = 2;   // ≤ 512 bytes
  // Optional so a name/description edit doesn't reset it; present only when
  // the public-listing toggle is being changed.
  optional bool public_listing = 3;
}

message ServerUpdateResponse {
  bool success = 1;
  string message = 2;
}

// One moderation / management event. `action` is a stable snake_case
// verb ("kick", "ban", "unban", "timeout", "timeout_clear", "role_create",
// "role_update", "role_delete", "member_roles", "channel_create",
// "channel_rename", "channel_delete", "channel_update", "channel_wipe",
// "message_delete", "overwrite_set", "nickname", "server_update",
// "ownership_transfer", "voice_mod", "invite_create", "invite_revoke",
// "category_sync", "overwrite_sync", "storage_min_free").
message AuditEntry {
  int64 id = 1;
  int64 timestamp = 2;
  string actor = 3;
  string action = 4;
  string target = 5;      // username, role name, invite code, … (may be empty)
  string channel_id = 6;  // when channel-scoped
  string details = 7;     // free-text summary ("reason: spam", "+Mod −Helper", …)
  int64 actor_uid = 8;    // 0 on entries from before users by uid
  int64 target_uid = 9;   // set when the target is a member
}

message AuditLogRequest {
  int64 before_id = 1;    // 0 = newest
  int32 limit = 2;        // server clamps to [1, 100]
  // Search: entries whose actor, target, action, details, channel name, or
  // the nickname / role name behind actor or target contain this
  // (case-insensitive for ASCII). "" = no text filter.
  string query = 3;
  // Only these action verbs; empty = all. At most 32 are honoured.
  repeated string actions = 4;
  // Echoed back so the client can drop answers to superseded searches.
  uint32 seq = 5;
}

message AuditLogResponse {
  bool success = 1;
  string message = 2;
  repeated AuditEntry entries = 3;   // newest first
  bool has_more = 4;
  uint32 seq = 5;
}

// until = 0 clears an active timeout. Clamped to 28 days.
message TimeoutMemberRequest {
  string username = 1;
  int64 until = 2;
  string reason = 3;
  int64 uid = 4;   // preferred over username
}

message VoiceModRequest {
  enum Action {
    SERVER_MUTE = 0;
    SERVER_UNMUTE = 1;
    SERVER_DEAFEN = 2;
    SERVER_UNDEAFEN = 3;
    MOVE = 4;          // requires channel_id; the actor must see it, the
                       // target needs nothing there (a voice pass is granted)
    DISCONNECT = 5;
  }
  // Permissions v3: MUTE_MEMBERS / DEAFEN_MEMBERS / MOVE_MEMBERS, resolved
  // in the target's current voice channel, plus the role hierarchy
  // (strictly above, or a peer via RoleInfo.manage_each_other).
  string username = 1;
  Action action = 2;
  string channel_id = 3;
  int64 uid = 4;   // preferred over username
}

// Sent to the affected user only.
message VoiceForceNotify {
  enum Action { MOVED = 0; DISCONNECTED = 1; }
  Action action = 1;
  string channel_id = 2;   // MOVED: the new channel
  string actor = 3;
  int64 actor_uid = 4;
}

message TransferOwnershipRequest {
  string new_owner = 1;
  int64 new_owner_uid = 2;   // preferred over new_owner
}

// --- Storage (MANAGE_SERVER) ---
// The Storage tab in server settings. All byte counts are int64 (files can
// exceed 2 GiB). "volume" = the filesystem holding the attachment store on the
// host machine (std::filesystem::space); "this server's" figures are computed
// from the DB, not a filesystem walk.
message StorageKindUsage {
  int32 kind  = 1;   // Attachment.Kind
  int64 bytes = 2;
  int64 count = 3;
}
message StorageChannelUsage {
  string channel_id = 1;
  int64  bytes      = 2;
  int64  count      = 3;
}
message StorageLargestItem {
  int64  attachment_id = 1;
  string filename      = 2;
  int64  size_bytes    = 3;
  string channel_id    = 4;
  int32  kind          = 5;
}
message StorageInfoRequest {}
message StorageInfoResponse {
  bool   success = 1;
  string message = 2;
  // Host volume holding the attachment store.
  int64  volume_total_bytes     = 3;
  int64  volume_available_bytes = 4;  // available to the server process
  // This community's own footprint.
  int64  attachments_bytes = 5;   // SUM(size_bytes) of live (non-purged) rows
  int64  thumbnails_bytes  = 6;   // SUM(thumbnail_size_bytes)
  int64  database_bytes    = 7;   // SQLite file + -wal + -shm
  int64  attachment_count  = 8;   // live rows
  int64  min_free_bytes    = 9;   // headroom threshold enforced on upload
  repeated StorageKindUsage    by_kind    = 10;
  repeated StorageChannelUsage by_channel = 11;  // highest first
  repeated StorageLargestItem  largest    = 12;  // highest first, capped
}
message StorageConfigSetRequest {
  int64 min_free_bytes = 1;  // clamped server-side to a sane range
}

// --- Central-hosted invite lookup ---
// Community servers register each live invite with the central server so
// clients can redeem a raw code without knowing the community host:port.

message InviteRegisterRequest {
  string code = 1;
  string host = 2;
  uint32 port = 3;
  int64 expires_at = 4;  // 0 = never
}

message InviteUnregisterRequest {
  string code = 1;
}

message InviteResolveRequest {
  string code = 1;
}

message InviteResolveResponse {
  bool success = 1;
  string message = 2;
  string host = 3;
  uint32 port = 4;
  // Echoed so the client can correlate concurrent lookups.
  string code = 5;
  // See CommunityServerInfo.cert_fingerprint.
  string cert_fingerprint = 6;
  // Pre-join preview for invite cards in chat (the invite is the
  // authorisation to see this much, as on Discord). Populated from the
  // community's heartbeat row when central knows it; 0 / empty
  // otherwise and from older centrals, in which case the card shows
  // host:port. server_id keys FETCH_SERVER_PICTURE_REQ.
  int64 server_id = 7;
  string server_name = 8;
  string server_description = 9;
  int32 member_count = 10;
  string picture_version = 11;
}

// --- Video codec negotiation messages ---

// Sent by the streamer when it switches codec/resolution/fps mid-stream.
// Server validates the sender owns the stream, updates the registry
// entry, and rebroadcasts StreamPresenceUpdate to the channel.
message StreamCodecChangedNotify {
  string channel_id = 1;
  string streamer_username = 2;
  VideoCodec new_codec = 3;
  uint32 new_width = 4;
  uint32 new_height = 5;
  uint32 new_fps = 6;
  enum Reason {
    REASON_UNKNOWN = 0;
    WATCHER_JOINED_LOW_CAPS = 1;
    LIMITING_WATCHER_LEFT = 2;
    STREAMER_INITIATED = 3;
  }
  Reason reason = 7;
  int64 streamer_uid = 8;
}

// Sent by a client mid-session when the user clicks "Refresh codec
// capabilities" in Settings. Server stores the new caps on the session
// and rebroadcasts VoicePresenceUpdate so peers see the change without
// the user having to leave and rejoin the voice channel.
message UpdateCapabilitiesRequest {
  ClientCapabilities capabilities = 1;
}

// Sent by the community server to the streamer when a watcher joins or
// leaves their stream (or disconnects from voice while watching). The
// streamer uses this to drive the LCD picker and decide whether to
// renegotiate the codec. Only the stream owner receives this — other
// channel members don't need to know.
message StreamWatcherNotify {
  string channel_id = 1;
  string streamer_username = 2;
  string watcher_username = 3;
  enum Action {
    ACTION_UNKNOWN = 0;
    JOINED = 1;
    LEFT = 2;
  }
  Action action = 4;
  int64 streamer_uid = 5;
  int64 watcher_uid = 6;
}

// --- Avatar Messages ---
// Per-user profile pictures stored on central. Bytes are validated as
// JPEG (magic 0xFF 0xD8) and capped at 200 KB on the server. Version
// is sha256-hex of the bytes (empty string when no avatar). Clients
// cache by (username, version); AvatarChanged broadcasts invalidate.
// See docs/superpowers/specs/2026-05-12-custom-profile-pictures-design.md.

message UpdateAvatarReq {
  bytes data = 1;       // empty = remove; otherwise JPEG bytes, max 1 MB
}

message UpdateAvatarRes {
  bool success = 1;
  string message = 2;
  string version = 3;   // sha256-hex; '' on removal
}

message FetchAvatarReq {
  string username = 1;
  int64 uid = 2;  // preferred over username
}

message FetchAvatarRes {
  string username = 1;
  string version = 2;   // '' when user has no avatar
  bytes data = 3;       // empty when version == ''
  int64 uid = 4;
}

message AvatarChanged {
  string username = 1;
  string version = 2;   // '' on removal
  int64 uid = 3;
}

// On-demand fetch of the latest thumbnail for a currently-streaming user.
// Sent by the client when a UserProfilePopup opens for a user who's known
// to be streaming. The community server keeps the most recent thumbnail
// in `latest_thumbnails_` and replies with the JPEG bytes (or empty if
// no frame has arrived yet).
message FetchStreamThumbnailReq {
  string owner_username = 1;
  int64 owner_uid = 2;   // preferred over owner_username
}

message FetchStreamThumbnailRes {
  string owner_username = 1;
  bytes thumbnail_data = 2;  // empty when no thumbnail cached yet
  int64 owner_uid = 3;
}

// --- Persistent DMs ---
// (see docs/superpowers/specs/2026-05-14-persistent-dms-design.md)

// Pages (review A1): central answers at most 200 conversations and 1.5 MiB
// per page, newest first; the client asks for the next page with the
// previous page's oldest last_message_id until has_more is false.
message DmConversationsReq {
  // 0 = the newest conversations; else those whose last message id is
  // below this.
  int64 before_id = 1;
}

message DmConversationPreview {
  string peer = 1;
  // A preview: at most 512 bytes, ending in "…" when cut. An encrypted last
  // message rides whole in last_message_envelope instead (it can't be cut,
  // and the client opens it for the preview line); it counts toward the
  // page's byte budget.
  string last_message_content = 2;
  string last_message_sender = 3;  // either the local user or the peer
  int64  last_message_id = 4;
  int64  last_timestamp = 5;
  int64  unread_count = 6;
  // E2EE — the last message's envelope when it was sent encrypted.
  bytes  last_message_envelope = 7;
  int64  peer_uid = 8;
  int64  last_message_sender_uid = 9;
  // Set when the last message has an envelope: the names it was sealed
  // under (see DmHistoryMessage).
  string sealed_sender = 10;
  string sealed_recipient = 11;
}
message DmConversationsRes {
  repeated DmConversationPreview conversations = 1;
  bool  has_more = 2;    // older conversations follow this page
  int64 before_id = 3;   // echoes the request
}

message DmHistoryReq {
  string peer = 1;
  int64  before_id = 2;   // 0 = latest
  int32  limit = 3;       // server clamps to 200 (100 per side with around_id)
  int64  around_id = 4;   // >0: context window centered on this DM id
  int64  after_id  = 5;   // >0: page newer than this DM id
  int64  peer_uid = 6;   // preferred over peer
}
message DmHistoryMessage {
  int64  id = 1;
  string sender = 2;
  string content = 3;
  int64  timestamp = 4;
  int64  edited_at = 5;   // unix seconds; 0 = never edited
  int64  reply_to = 6;    // id of the DM this replies to; 0 = not a reply
  // Embedded parent preview — see ChannelMessage.reply_to_sender/-content.
  // Empty sender with reply_to>0 = parent was deleted. Cut to 512 bytes, as
  // in DirectMessage.
  string reply_to_sender = 7;
  string reply_to_content = 8;
  // E2EE — see DirectMessage.envelope / reply_to_envelope.
  bytes  envelope = 9;
  bytes  reply_to_envelope = 10;
  int64  sender_uid = 11;
  int64  reply_to_sender_uid = 12;
  // Set when the row has an envelope: the sender and recipient names it was
  // sealed under, which a v1 envelope binds. `sender` is the current name.
  string sealed_sender = 13;
  string sealed_recipient = 14;
  string reply_to_sealed_sender = 15;
  string reply_to_sealed_recipient = 16;
}
// A page holds the rows asked for, cut short where they would pass 1.5 MiB
// (review A1); has_more / has_more_after then stand for the rows left out,
// so a page shorter than `limit` need not be the end. A message stored before
// the 64 KiB cap comes cut to 64 KiB, ending in "…".
message DmHistoryRes {
  string peer = 1;
  repeated DmHistoryMessage messages = 2;  // newest first (older/present); oldest→newest for around/after windows
  bool   has_more = 3;         // older messages exist above the returned slice
  bool   has_more_after = 4;   // newer messages exist below the returned slice
  int64  around_id = 5;        // echoes the request mode so the client routes the reply
  int64  after_id  = 6;
  int64  peer_uid = 7;
  int64  before_id = 8;        // echoed; all three 0 = the newest page (see ChannelHistoryResponse)
}

message DmMarkReadReq {
  string peer = 1;
  int64  up_to_id = 2;
  int64  peer_uid = 3;   // preferred over peer
}

// To the reader's other sessions after a DmMarkReadReq (multi-device): the
// conversation with `peer_uid` is read up to `up_to_id` (the request's
// value; central's cursor never moves back).
message DmReadSync {
  int64 peer_uid = 1;
  int64 up_to_id = 2;
}

// --- Auto-rejoin community memberships ---
// See docs/superpowers/specs/2026-05-14-auto-rejoin-communities-design.md
// (+ plan amendment: SERVER_HEARTBEAT_RES exists so the community can
// learn its central-assigned server_id at startup).

message MembershipRegisterReq {
  string username = 1;
  int64  server_id = 2;
  int64  uid = 3;   // the member's account; central keys memberships by it
}

message MembershipRevokeReq {
  string username = 1;
  int64  server_id = 2;
  int64  uid = 3;
}

// To every session of the account when a community registers a membership
// it didn't have (another device joined): the client connects to it.
message MembershipAdded {
  CommunityServerInfo server = 1;
}

// Central closes this connection right after it (multi-device).
message SessionClosed {
  enum Reason {
    // A newer sign-in with this connection's device id took over. A live
    // client that reads this is a copy of the install running elsewhere: it
    // makes itself a new device id and signs in again as its own device.
    REPLACED = 0;
    // The account signed its other devices out: sign out here, don't
    // reconnect.
    SIGNED_OUT = 1;
  }
  Reason reason = 1;
}

// Sent by central in response to a SERVER_HEARTBEAT, over the same
// one-shot TLS connection. Lets the community learn its
// central-assigned server_id (community_servers.id) so it can
// populate Membership{Register,Revoke}Req on future packets.
message ServerHeartbeatRes {
  int64 server_id = 1;
}

// --- Message deletion ---
// See docs/superpowers/specs/2026-05-15-message-deletion-design.md

message DmDeleteReq {
  string peer = 1;
  int64  message_id = 2;
  int64  peer_uid = 3;   // preferred over peer
}

message DmDeleteRes {
  bool   success = 1;
  string message = 2;
  string peer = 3;
  int64  message_id = 4;
  int64  peer_uid = 5;
}

// Peer field is rewritten by central per recipient — always "the
// other user" from the receiving session's perspective.
message DmMessageDeleted {
  string peer = 1;
  int64  message_id = 2;
  int64  deleted_at = 3;
  int64  peer_uid = 4;
}

message DmEditReq {
  string peer = 1;
  int64  message_id = 2;
  string content = 3;   // new body; central enforces sender == editor
  bytes  envelope = 4;  // E2EE: the new body sealed; content is then the placeholder
  int64  peer_uid = 5;   // preferred over peer
}

message DmEditRes {
  bool   success = 1;
  string message = 2;
  string peer = 3;
  int64  message_id = 4;
  int64  peer_uid = 5;
}

// Peer rewritten per recipient, like DmMessageDeleted.
message DmMessageEdited {
  string peer = 1;
  int64  message_id = 2;
  string content = 3;
  int64  edited_at = 4;
  bytes  envelope = 5;  // E2EE — see DirectMessage.envelope
  string sender = 6;    // the message's author (= the editor), central-stamped; '' from older centrals
  int64  peer_uid = 7;
  int64  sender_uid = 8;
}

message MessageDeleteReq {
  string channel_id = 1;
  int64  message_id = 2;
}

message MessageDeleteRes {
  bool   success = 1;
  string message = 2;
  string channel_id = 3;
  int64  message_id = 4;
}

message ChannelMessageDeleted {
  string channel_id = 1;
  int64  message_id = 2;
  int64  deleted_at = 3;
  // For future audit-log surfacing; not consumed by current UI.
  string deleted_by = 4;
  int64 deleted_by_uid = 5;
}

message MessageEditReq {
  string channel_id = 1;
  int64  message_id = 2;
  string content = 3;   // new body; community enforces sender == editor
  bytes  envelope = 4;  // encrypted channels: the sealed new body
}

message MessageEditRes {
  bool   success = 1;
  string message = 2;
  string channel_id = 3;
  int64  message_id = 4;
}

message ChannelMessageEdited {
  string channel_id = 1;
  int64  message_id = 2;
  string content = 3;
  int64  edited_at = 4;
  string editor = 5;    // the message's sender (who edited it)
  bytes  envelope = 6;  // encrypted channels
  bool   suppress_embeds = 7;  // re-evaluated at edit time (see ChannelMessage)
  int64 editor_uid = 8;
}

// See Packet.CHANNEL_MSG_REJECTED.
message ChannelMessageRejected {
  string channel_id = 1;
  // The ChannelMessage.nonce of the rejected request ('' if the client
  // sent none).
  string nonce = 2;
  string reason = 3;
  // Slowmode: whole seconds until this user may post in the channel
  // again (rounded up), so the client can count down. 0 for any other
  // refusal.
  int32 retry_after_seconds = 4;
}

// --- Custom server pictures ---
// See docs/superpowers/specs/2026-05-15-custom-server-pictures-design.md

message UpdateServerPictureReq {
  bytes data = 1;   // empty = remove
}

message UpdateServerPictureRes {
  bool   success = 1;
  string message = 2;
  string version = 3;   // sha256-hex; '' on removal or failure
}

message SyncServerPictureReq {
  string host = 1;
  int32  port = 2;
  bytes  data = 3;
  string version = 4;   // pre-computed by community
  int64  server_id = 5; // preferred identity when known (see ServerHeartbeat)
}

message FetchServerPictureReq {
  int32 server_id = 1;
}

message FetchServerPictureRes {
  int32  server_id = 1;
  string version = 2;
  bytes  data = 3;
}

message ServerPictureChanged {
  int32  server_id = 1;
  string version = 2;
}

// ── P2P DM calls ─────────────────────────────────────────────────────
// Signaling for a direct (peer-to-peer) voice/stream session between two
// users. Media never touches central: after INVITE/ACCEPT exchange the
// X25519 public keys + UDP candidates, both clients hole-punch and seal
// every datagram with AES-256-GCM keys derived from the shared secret.

message CallCandidate {
  // Which of the two media sockets this address belongs to (voice
  // carries AUDIO/STREAM_AUDIO/PING, media carries VIDEO/FEC/PLI/NACK).
  enum Socket { VOICE = 0; MEDIA = 1; }
  // HOST = a local interface address, SRFLX = the STUN-reflexive
  // (public NAT-mapped) address of that same socket. IPv4 only in v1.
  enum Kind { HOST = 0; SRFLX = 1; }
  Socket socket = 1;
  Kind kind = 2;
  string ip = 3;
  uint32 port = 4;
}

message CallStreamMeta {
  int32 codec = 1;       // VideoCodec byte (1=H264_HW 2=H264_SW 3=H265 4=AV1)
  uint32 width = 2;
  uint32 height = 3;
  uint32 fps = 4;
  bool has_audio = 5;
}

message CallSignal {
  enum Kind {
    INVITE = 0;        // caller→callee: pub_key + candidates
    RINGING = 1;       // callee client auto-ack so the caller shows "Ringing…"
    ACCEPT = 2;        // callee→caller: pub_key + candidates
    REJECT = 3;        // callee declined
    BUSY = 4;          // callee already in a call
    CANCEL = 5;        // caller gave up before an answer
    HANGUP = 6;        // either side ends an active call
    PEER_OFFLINE = 7;  // central→sender: `to` has no session
    NOT_ALLOWED = 8;   // central→sender: check_dm_allowed refused the INVITE
    STREAM_START = 9;  // streamer→peer: screen share started (stream meta)
    STREAM_STOP = 10;  // streamer→peer: screen share ended
    // Central→the callee's other devices, which were ringing (multi-device):
    // one device answered (also to a device whose ACCEPT lost the race), or
    // one declined. `from` is the caller, as in the INVITE.
    ANSWERED_ELSEWHERE = 11;
    DECLINED_ELSEWHERE = 12;
  }
  Kind kind = 1;
  string call_id = 2;                     // caller-minted UUID
  string from = 3;                        // central-stamped; clients never trust their own value
  string to = 4;
  bytes pub_key = 5;                      // 32-byte X25519 ephemeral public key (INVITE/ACCEPT)
  repeated CallCandidate candidates = 6;  // ≤16 (INVITE/ACCEPT)
  CallStreamMeta stream = 7;              // STREAM_START only
  int64 timestamp = 8;                    // central-stamped
  // Authenticated key exchange (2026-09-03; v2 binds uids since the uid
  // design's stage 4): Ed25519 signature by the sender's E2EE identity over
  //   "decibell-call-auth-v2" ‖ 0 ‖ call_id ‖ 0 ‖ from_uid ‖ to_uid ‖ pub_key
  // (uids as i64 LE; see native e2ee/call_auth.rs)
  // and the identity generation that signed it. Empty / 0 when the
  // sender has no E2EE keys. The receiver verifies against the peer's
  // current identity before deriving media keys — a central that swaps
  // pub_key can't forge this. INVITE / ACCEPT only; central relays it.
  bytes pub_key_sig = 9;                  // 64 bytes
  uint32 key_id = 10;
  int64 from_uid = 11;                    // central-stamped, like `from`
  int64 to_uid = 12;                      // routes the signal; `to` is read only on an INVITE to a typed name
}

// --- End-to-end encrypted DMs ---
// See docs/superpowers/specs/2026-09-03-e2ee-dms-design.md. Central is a
// dumb store for these: it assigns key_id, checks sizes, and never
// interprets dh_pub / sign_pub / signature / backup beyond that.

// A user's published identity. `signature` is Ed25519(sign_priv, m), where
// m binds the account (see `binding`) to dh_pub ‖ sign_pub — the client
// verifies it on fetch so central can't serve a mix-and-match bundle.
message E2eeKeyBundle {
  string username = 1;
  uint32 key_id = 2;       // central-assigned, monotonic per user (0 in a publish request)
  bytes  dh_pub = 3;       // 32-byte X25519 public key
  bytes  sign_pub = 4;     // 32-byte Ed25519 public key
  bytes  signature = 5;    // 64 bytes
  int64  created_at = 6;   // central-stamped unix seconds
  int64  uid = 7;          // central-stamped
  // The name a v1 bundle's signature covers: the publisher's name when it
  // was published (central-stamped; can predate a rename).
  string signed_name = 8;
  // What the signature binds (uid design, stage 4):
  //   1 (or 0 from older centrals) = the name:
  //     "decibell-e2ee-bundle-v1" ‖ 0 ‖ signed_name ‖ 0 ‖ dh_pub ‖ sign_pub
  //   2 = the uid (int64 LE):
  //     "decibell-e2ee-bundle-v2" ‖ 0 ‖ uid ‖ dh_pub ‖ sign_pub
  // Set by the publisher; stored and returned by central.
  uint32 binding = 9;
}

// Publish a new bundle and/or replace the passphrase-wrapped private-key
// backup. Either part may be absent (change-passphrase re-uploads only
// the backup); at least one must be present.
message E2eePublishKeysReq {
  E2eeKeyBundle bundle = 1;
  bytes backup = 2;        // opaque, ≤ 8 KiB
  // Re-sign the current bundle instead of publishing a new one: `bundle`
  // names the current key_id with the same dh_pub / sign_pub and carries
  // the new signature and binding. Central replaces them in place (no new
  // key_id) and refuses when the keys or key_id don't match. No backup.
  bool rebind = 3;
}
message E2eePublishKeysRes {
  bool   success = 1;
  string message = 2;
  uint32 key_id = 3;       // the id assigned to the published bundle (or the current one)
}

message E2eeFetchKeysReq {
  string username = 1;
  uint32 key_id = 2;       // 0 = the user's current bundle
  int64  uid = 3;          // preferred over username
}
message E2eeFetchKeysRes {
  string username = 1;
  uint32 key_id = 2;       // echoes the request so the client routes the reply
  bool   found = 3;
  E2eeKeyBundle bundle = 4;
  int64  uid = 5;
}

// The caller's own backup blob (never anyone else's).
message E2eeFetchBackupReq {}
message E2eeFetchBackupRes {
  bool   found = 1;
  uint32 key_id = 2;       // the current key_id the blob was uploaded with
  bytes  backup = 3;
}

// To the account's watchers when it publishes a new bundle, like
// AVATAR_CHANGED. Clients drop their cached "current" bundle for that user
// and re-fetch on the next send (and forget it when they start watching,
// in case they missed a change meanwhile).
message E2eeKeysChanged {
  string username = 1;
  uint32 key_id = 2;
  int64  uid = 3;
}

// --- MLS-encrypted voice channels ---
// See docs/superpowers/specs/2026-09-03-mls-voice-channel-encryption-design.md.
// All `bytes` here are RFC 9420 MLSMessage encodings the server treats as
// opaque (cap 256 KiB).

message MlsGroupInfoReq {
  string channel_id = 1;
}
message MlsGroupInfoRes {
  string channel_id = 1;
  bool   exists = 2;        // false = no group yet → the caller creates one
  uint64 epoch = 3;         // current epoch (the GroupInfo below is for it)
  bytes  group_info = 4;    // GroupInfo with ratchet tree + external pub
}

// First member in the channel: register the freshly created group (epoch 0).
// Fails if a group already exists (the caller then joins it instead).
message MlsGroupCreateReq {
  string channel_id = 1;
  bytes  group_info = 2;
}

// A commit (external join, removal, update) creating `epoch`. Accepted only
// when epoch == current + 1; on success the server stores `group_info` and
// forwards `commit` to the other participants.
message MlsCommitReq {
  string channel_id = 1;
  uint64 epoch = 2;
  bytes  commit = 3;
  bytes  group_info = 4;
}
message MlsCommitRes {
  string channel_id = 1;
  bool   success = 2;
  string message = 3;
  uint64 epoch = 4;         // the server's current epoch after handling
}
message MlsCommitBroadcast {
  string channel_id = 1;
  uint64 epoch = 2;
  string sender = 3;        // committer, server-stamped
  bytes  commit = 4;
  int64 sender_uid = 5;
}

// --- Encrypted text channels ---
// See docs/superpowers/specs/2026-09-04-encrypted-text-channels-design.md.
// A "blob" is a DM envelope (content tag 0x02) carrying one epoch key,
// sealed by `sender`'s identity to `recipient`'s. Opaque to the server.

// Paged (review S14). The first page (both cursors 0) carries the viewer
// list, the first needs and the caller's first blobs; a reply with
// `more_blobs` / `more_needs` set is continued by a request with that
// cursor alone: `after_epoch` (the last blob's epoch) pages only the
// caller's blobs, `needs_after_uid` (the last need's uid) only the needs.
message ChannelKeysReq {
  string channel_id = 1;
  uint32 after_epoch = 2;
  int64 needs_after_uid = 3;
}
message ChannelKeyBlob {
  uint32 epoch = 1;
  string sender = 2;      // who sealed it (server-stamped on publish)
  string recipient = 3;   // set in publish requests; empty in the caller's own list
  bytes  blob = 4;
  // The names stay the ones it was sealed under (a v1 envelope binds them).
  int64 sender_uid = 5;
  int64 recipient_uid = 6;   // preferred over recipient in publish requests
  // Replies: the epoch's key check (ChannelKeysPublishReq.key_check), which
  // the key inside must match; empty for epochs minted before it existed.
  bytes key_check = 7;
}
message ChannelKeyNeed {
  string username = 1;
  repeated uint32 epochs = 2;   // epochs this viewer has no blob for
  int64 uid = 3;
}
message ChannelKeysRes {
  string channel_id = 1;
  bool   encrypted = 2;
  uint32 current_epoch = 3;             // 0 = no epoch yet (first sender creates 1)
  repeated ChannelKeyBlob blobs = 4;    // the caller's own blobs, every epoch
  repeated ChannelKeyNeed needs = 5;    // viewers missing blobs (capped)
  repeated string members = 6;          // everyone who can VIEW the channel (capped)
  repeated int64 member_uids = 7;   // parallel to members
  bool more_blobs = 8;              // continue with after_epoch = the last blob's epoch
  bool more_needs = 9;              // continue with needs_after_uid = the last need's uid
  uint32 after_epoch = 10;          // the request's cursors, echoed
  int64 needs_after_uid = 11;
  // Nobody holds the current epoch any more (its holders left or dropped
  // it): any viewer may mint the next one.
  bool current_orphaned = 12;
}
// epoch == current + 1 creates the epoch (≥ 1 blob); epoch <= current fills
// gaps (only missing recipients are inserted). Blobs for non-viewers drop,
// and so do blobs for members who rejected the publisher's blobs as bad.
message ChannelKeysPublishReq {
  string channel_id = 1;
  uint32 epoch = 2;
  repeated ChannelKeyBlob blobs = 3;
  // Creation only, required: HMAC-SHA256 of the new key over the channel and
  // epoch (native e2ee/channel_envelope.rs `key_check`). Every blob of the
  // epoch must carry a key that matches it, so a member can tell a wrong key
  // from the right one.
  bytes key_check = 4;
}
message ChannelKeysPublishRes {
  string channel_id = 1;
  bool   success = 2;
  string message = 3;
  uint32 current_epoch = 4;
}
// Broadcast to the channel's viewers: a new epoch exists, or someone lacks
// keys. `filler` is the lowest online member holding a current-epoch blob —
// that client fills (and rotates when `rotate` is set, after a removal).
message ChannelKeysChanged {
  string channel_id = 1;
  uint32 current_epoch = 2;
  string filler = 3;
  bool   rotate = 4;
  int64 filler_uid = 5;   // users by uid (2026-10-15)
}
// The caller's own blobs for `epochs` can't be used: the server deletes them,
// so the caller shows up in `needs` again, and asks a filler. `bad`: they
// don't open, bind another channel or epoch, or fail the key check (rather
// than being sealed to a key of ours we no longer have): their senders are
// refused for the caller in this channel — no blobs to them, never their
// filler — while anyone else holds the epoch. A refused sender who is the
// only way to the key still gets to seal it, so a client bug flagging honest
// blobs can't lock a member out for good.
message ChannelKeysReject {
  string channel_id = 1;
  repeated uint32 epochs = 2;
  bool bad = 3;
}

// --- Encrypted channel message body (client-only; opaque to every server) ---
// The plaintext inside a channel envelope with content tag 0x03: the
// message text plus one entry per encrypted attachment bound to the
// message. Prost-encoded by the client; C++ never touches it.

message EncryptedAttachmentMeta {
  int64  id = 1;             // the server's attachment id
  bytes  key = 2;            // 32-byte AES-256-GCM key, unique per attachment
  string filename = 3;
  string mime = 4;
  int64  size_bytes = 5;     // plaintext size
  uint32 width = 6;
  uint32 height = 7;
  uint32 duration_ms = 8;
  string placeholder = 9;    // base64 ThumbHash
  uint32 chunk_bytes = 10;   // plaintext bytes per sealed chunk (64 KiB)
  uint32 thumbnail_sizes_mask = 11;  // sealed JPEG thumbnails uploaded (bit 0 = 320 px, 1 = 640, 2 = 1280)
}
message EncryptedMessageBody {
  string text = 1;
  repeated EncryptedAttachmentMeta attachments = 2;
}
