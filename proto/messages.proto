syntax = "proto3";
package chatproj;

// --- Video codec negotiation ---
// Wire-compatible with the legacy single-codec setup: CODEC_H264_HW = 1
// preserves the value the existing Tauri client has been stamping in
// UdpVideoPacket.codec since launch. CODEC_UNKNOWN = 0 reclaims the
// retired CODEC_VP9 slot — server has always been codec-agnostic on
// the relay path so the change has no on-wire impact.
enum VideoCodec {
  CODEC_UNKNOWN = 0;
  CODEC_H264_HW = 1;
  CODEC_H264_SW = 2;
  CODEC_H265 = 3;
  CODEC_AV1 = 4;
}

message CodecCapability {
  VideoCodec codec = 1;
  uint32 max_width = 2;
  uint32 max_height = 3;
  uint32 max_fps = 4;
}

message ClientCapabilities {
  repeated CodecCapability encode = 1;
  repeated CodecCapability decode = 2;
}

message Packet {
  enum Type {
    UNKNOWN = 0;
    HANDSHAKE = 1;
    REGISTER_REQ = 2;
    REGISTER_RES = 3;
    LOGIN_REQ = 4;
    LOGIN_RES = 5;
    DIRECT_MSG = 6;
    PRESENCE_UPDATE = 7;
    SERVER_LIST_REQ = 8;
    SERVER_LIST_RES = 9;

    // Community Server Specific Types
    COMMUNITY_AUTH_REQ = 10;
    COMMUNITY_AUTH_RES = 11;
    CHANNEL_MSG = 12;
    reserved 13, 14;
    reserved "JOIN_CHANNEL_REQ", "JOIN_CHANNEL_RES";

    // Friend System Types
    FRIEND_ACTION_REQ = 15;
    FRIEND_ACTION_RES = 16;
    FRIEND_LIST_REQ = 17;
    FRIEND_LIST_RES = 18;

    JOIN_VOICE_REQ = 19;
    LEAVE_VOICE_REQ = 20;
    VOICE_PRESENCE_UPDATE = 21;
    VOICE_STATE_NOTIFY = 27;
    DM_PRIVACY = 28;

    // Screen Sharing Signaling
    STREAM_PRESENCE_UPDATE = 22;
    START_STREAM_REQ = 23;
    STOP_STREAM_REQ = 24;
    WATCH_STREAM_REQ = 25;
    STOP_WATCHING_REQ = 26;
    STREAM_THUMBNAIL_UPDATE = 29;
    SERVER_HEARTBEAT = 30;
    CLIENT_PING = 31;       // Client→central keepalive (no payload needed)

    // Membership + invites (community server)
    INVITE_CREATE_REQ = 32;
    INVITE_CREATE_RES = 33;
    INVITE_LIST_REQ = 34;
    INVITE_LIST_RES = 35;
    INVITE_REVOKE_REQ = 36;
    INVITE_REVOKE_RES = 37;
    MEMBER_LIST_REQ = 38;
    MEMBER_LIST_RES = 39;
    KICK_MEMBER_REQ = 40;
    BAN_MEMBER_REQ = 41;
    MOD_ACTION_RES = 42;    // shared kick/ban/leave response
    LEAVE_SERVER_REQ = 43;
    SERVER_META_UPDATE = 44; // server pushes owner/name/etc to client after auth
    MEMBERSHIP_REVOKED = 45; // server→client: you were kicked/banned

    // Central-hosted invite lookup (so clients can redeem a raw code
    // without knowing the hosting community server's host:port).
    INVITE_REGISTER_REQ = 46;    // community→central (shared secret)
    INVITE_UNREGISTER_REQ = 47;  // community→central (shared secret)
    INVITE_RESOLVE_REQ = 48;     // client→central (JWT)
    INVITE_RESOLVE_RES = 49;     // central→client

    // Persistent channel messages + per-channel retention.
    CHANNEL_HISTORY_REQ = 50;    // client→community
    CHANNEL_HISTORY_RES = 51;    // community→client
    CHANNEL_UPDATE_REQ = 52;     // client→community (owner-only)
    CHANNEL_UPDATE_RES = 53;     // community→client
    CHANNEL_PRUNED = 54;         // community→client: retention sweep happened
    CHANNEL_WIPE_REQ = 55;       // client→community (owner-only): nuke all messages in a channel
    CHANNEL_WIPE_RES = 56;       // community→requester: result of the wipe
    CHANNEL_WIPED = 57;          // community→all members: channel was wiped, drop local message state

    // Video codec negotiation.
    STREAM_CODEC_CHANGED_NOTIFY = 58;  // streamer→server→all in channel
    UPDATE_CAPABILITIES_REQ = 59;      // client→community when caps refreshed mid-session
    STREAM_WATCHER_NOTIFY = 60;        // server→streamer on watch/unwatch (Plan C)

    // Avatar bytes + cache-invalidation broadcast.
    UPDATE_AVATAR_REQ = 61;            // client→central
    UPDATE_AVATAR_RES = 62;            // central→client
    FETCH_AVATAR_REQ = 63;             // client→central
    FETCH_AVATAR_RES = 64;             // central→client
    AVATAR_CHANGED = 65;               // central→all online sessions

    // Live-stream popup: on-demand thumbnail fetch (community server).
    FETCH_STREAM_THUMBNAIL_REQ = 66;
    FETCH_STREAM_THUMBNAIL_RES = 67;

    // Persistent DMs — see docs/superpowers/specs/
    // 2026-05-14-persistent-dms-design.md
    DM_CONVERSATIONS_REQ = 68;   // client→central; empty payload
    DM_CONVERSATIONS_RES = 69;   // central→client
    DM_HISTORY_REQ       = 70;   // client→central
    DM_HISTORY_RES       = 71;   // central→client
    DM_MARK_READ_REQ     = 72;   // client→central; fire-and-forget

    // Auto-rejoin — see docs/superpowers/specs/
    // 2026-05-14-auto-rejoin-communities-design.md (+ implementation
    // plan amendment: SERVER_HEARTBEAT_RES plumbs the assigned
    // server_id back to the community so it can populate the
    // membership packets).
    MEMBERSHIP_REGISTER_REQ = 73;  // community→central (shared secret)
    MEMBERSHIP_REVOKE_REQ   = 74;  // community→central (shared secret)
                                    // AND client→central (JWT) for stale cleanup
    SERVER_HEARTBEAT_RES    = 75;  // central→community (one-shot, post-heartbeat)

    // --- Message deletion ---
    // (see docs/superpowers/specs/2026-05-15-message-deletion-design.md)
    DM_DELETE_REQ           = 76;   // client→central; JWT-authed
    DM_DELETE_RES           = 77;   // central→requester
    DM_MESSAGE_DELETED      = 78;   // central→sender + recipient (success only)
    MESSAGE_DELETE_REQ      = 79;   // client→community
    MESSAGE_DELETE_RES      = 80;   // community→requester
    CHANNEL_MESSAGE_DELETED = 81;   // community→all members (success only)

    // --- Custom server pictures ---
    // (see docs/superpowers/specs/2026-05-15-custom-server-pictures-design.md)
    UPDATE_SERVER_PICTURE_REQ = 82;  // client→community (JWT)
    UPDATE_SERVER_PICTURE_RES = 83;  // community→requester
    SYNC_SERVER_PICTURE_REQ   = 84;  // community→central (shared secret)
    FETCH_SERVER_PICTURE_REQ  = 85;  // client→central (JWT)
    FETCH_SERVER_PICTURE_RES  = 86;  // central→requester
    SERVER_PICTURE_CHANGED    = 87;  // central→every online member

    // --- Roles + permissions (community server) ---
    // See docs/superpowers/specs/2026-08-17-roles-permissions-design.md
    // and the Permission enum for the bitfield the role carries.
    ROLE_LIST_REQ           = 88;  // client→community
    ROLE_LIST_RES           = 89;  // community→client; pushed after auth and
                                   // broadcast to everyone on any role change
    ROLE_CREATE_REQ         = 90;  // client→community (MANAGE_ROLES)
    ROLE_UPDATE_REQ         = 91;  // client→community (MANAGE_ROLES + hierarchy)
    ROLE_DELETE_REQ         = 92;  // client→community (MANAGE_ROLES + hierarchy)
    ROLE_ACTION_RES         = 93;  // community→requester: create/update/delete/assign result
    MEMBER_ROLES_UPDATE_REQ = 94;  // client→community: replace a member's role set
    UNBAN_MEMBER_REQ        = 95;  // client→community (BAN_MEMBERS); response via MOD_ACTION_RES

    // --- Channel management + nicknames ---
    // (MANAGE_CHANNELS / MANAGE_NICKNAMES; see the roles spec doc)
    CHANNEL_CREATE_REQ  = 96;   // client→community (MANAGE_CHANNELS)
    CHANNEL_DELETE_REQ  = 97;   // client→community (MANAGE_CHANNELS)
    CHANNEL_RENAME_REQ  = 98;   // client→community (MANAGE_CHANNELS)
    CHANNEL_ACTION_RES  = 99;   // community→requester: create/rename/delete result
    CHANNEL_LIST_UPDATE = 100;  // community→all members: full channel list push
    SET_NICKNAME_REQ    = 101;  // client→community (self, or MANAGE_NICKNAMES);
                                // response via MOD_ACTION_RES action="nickname"
    CHANNEL_REORDER_REQ = 102;  // client→community (MANAGE_CHANNELS):
                                // full new order after a drag; response via
                                // CHANNEL_ACTION_RES action="reorder"
  }

  Type type = 1;
  int64 timestamp = 2;
  string auth_token = 16;

  // Retired oneof field numbers — do not reuse. JOIN_CHANNEL_REQ/RES
  // were removed when text channels became a per-session subscription
  // implicit in COMMUNITY_AUTH_REQ rather than an explicit join.
  reserved 15, 17;
  reserved "join_channel_req", "join_channel_res";

  oneof payload {
    Handshake handshake = 3;
    RegisterRequest register_req = 4;
    RegisterResponse register_res = 5;
    LoginRequest login_req = 6;
    LoginResponse login_res = 7;
    DirectMessage direct_msg = 8;
    PresenceUpdate presence_update = 9;
    ServerListRequest server_list_req = 10;
    ServerListResponse server_list_res = 11;

    CommunityAuthRequest community_auth_req = 12;
    CommunityAuthResponse community_auth_res = 13;
    ChannelMessage channel_msg = 14;

    FriendActionReq friend_action_req = 18;
    FriendActionRes friend_action_res = 19;
    FriendListReq friend_list_req = 20;
    FriendListRes friend_list_res = 21;

    JoinVoiceRequest join_voice_req = 22;
    LeaveVoiceRequest leave_voice_req = 23;
    VoicePresenceUpdate voice_presence_update = 24;
    VoiceStateNotify voice_state_notify = 30;

    StreamPresenceUpdate stream_presence_update = 25;
    StartStreamRequest start_stream_req = 26;
    StopStreamRequest stop_stream_req = 27;
    WatchStreamRequest watch_stream_req = 28;
    StopWatchingRequest stop_watching_req = 29;
    DmPrivacySetting dm_privacy = 31;
    StreamThumbnailUpdate stream_thumbnail_update = 32;
    ServerHeartbeat server_heartbeat = 33;

    InviteCreateRequest invite_create_req = 34;
    InviteCreateResponse invite_create_res = 35;
    InviteListRequest invite_list_req = 36;
    InviteListResponse invite_list_res = 37;
    InviteRevokeRequest invite_revoke_req = 38;
    InviteRevokeResponse invite_revoke_res = 39;
    MemberListRequest member_list_req = 40;
    MemberListResponse member_list_res = 41;
    KickMemberRequest kick_member_req = 42;
    BanMemberRequest ban_member_req = 43;
    ModActionResponse mod_action_res = 44;
    LeaveServerRequest leave_server_req = 45;
    ServerMetaUpdate server_meta_update = 46;
    MembershipRevoked membership_revoked = 47;

    InviteRegisterRequest invite_register_req = 48;
    InviteUnregisterRequest invite_unregister_req = 49;
    InviteResolveRequest invite_resolve_req = 50;
    InviteResolveResponse invite_resolve_res = 51;

    ChannelHistoryRequest channel_history_req = 52;
    ChannelHistoryResponse channel_history_res = 53;
    ChannelUpdateRequest channel_update_req = 54;
    ChannelUpdateResponse channel_update_res = 55;
    ChannelPruned channel_pruned = 56;
    ChannelWipeRequest channel_wipe_req = 57;
    ChannelWipeResponse channel_wipe_res = 58;
    ChannelWiped channel_wiped = 59;

    StreamCodecChangedNotify stream_codec_changed_notify = 60;
    UpdateCapabilitiesRequest update_capabilities_req = 61;
    StreamWatcherNotify stream_watcher_notify = 62;

    // --- Avatar messages (see docs/superpowers/specs/
    //     2026-05-12-custom-profile-pictures-design.md §4) ---
    UpdateAvatarReq update_avatar_req = 63;
    UpdateAvatarRes update_avatar_res = 64;
    FetchAvatarReq fetch_avatar_req = 65;
    FetchAvatarRes fetch_avatar_res = 66;
    AvatarChanged avatar_changed = 67;

    // --- Live-stream popup thumbnails (see docs/superpowers/specs/
    //     2026-05-14-live-stream-indicators-design.md §2) ---
    FetchStreamThumbnailReq fetch_stream_thumbnail_req = 68;
    FetchStreamThumbnailRes fetch_stream_thumbnail_res = 69;

    // --- Persistent DMs (see docs/superpowers/specs/
    //     2026-05-14-persistent-dms-design.md) ---
    DmConversationsReq dm_conversations_req = 70;
    DmConversationsRes dm_conversations_res = 71;
    DmHistoryReq       dm_history_req       = 72;
    DmHistoryRes       dm_history_res       = 73;
    DmMarkReadReq      dm_mark_read_req     = 74;

    // --- Auto-rejoin community memberships ---
    MembershipRegisterReq membership_register_req = 75;
    MembershipRevokeReq   membership_revoke_req   = 76;
    ServerHeartbeatRes    server_heartbeat_res    = 77;

    // --- Message deletion ---
    DmDeleteReq           dm_delete_req           = 78;
    DmDeleteRes           dm_delete_res           = 79;
    DmMessageDeleted      dm_message_deleted      = 80;
    MessageDeleteReq      message_delete_req      = 81;
    MessageDeleteRes      message_delete_res      = 82;
    ChannelMessageDeleted channel_message_deleted = 83;

    // --- Custom server pictures ---
    UpdateServerPictureReq update_server_picture_req = 84;
    UpdateServerPictureRes update_server_picture_res = 85;
    SyncServerPictureReq   sync_server_picture_req   = 86;
    FetchServerPictureReq  fetch_server_picture_req  = 87;
    FetchServerPictureRes  fetch_server_picture_res  = 88;
    ServerPictureChanged   server_picture_changed    = 89;

    // --- Roles + permissions ---
    RoleListRequest          role_list_req           = 90;
    RoleListResponse         role_list_res           = 91;
    RoleCreateRequest        role_create_req         = 92;
    RoleUpdateRequest        role_update_req         = 93;
    RoleDeleteRequest        role_delete_req         = 94;
    RoleActionResponse       role_action_res         = 95;
    MemberRolesUpdateRequest member_roles_update_req = 96;
    UnbanMemberRequest       unban_member_req        = 97;

    // --- Channel management + nicknames ---
    ChannelCreateRequest  channel_create_req  = 98;
    ChannelDeleteRequest  channel_delete_req  = 99;
    ChannelRenameRequest  channel_rename_req  = 100;
    ChannelActionResponse channel_action_res  = 101;
    ChannelListUpdate     channel_list_update = 102;
    SetNicknameRequest    set_nickname_req    = 103;
    ChannelReorderRequest channel_reorder_req = 104;
  }
}

message Handshake {
  int32 protocol_version = 1;
  string client_id = 2;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3; 
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string jwt_token = 3;
  // Auto-rejoin: server-populated list of community servers this user
  // is a member of. Drives the auto-rejoin flow — see
  // docs/superpowers/specs/2026-05-14-auto-rejoin-communities-design.md.
  // Absent / empty on legacy servers; client treats as empty.
  repeated CommunityServerInfo memberships = 4;
}

message DirectMessage {
  string sender = 1;
  string recipient = 2;
  string content = 3;
  int64 timestamp = 4;
  // Server-assigned persistence id, stamped by central after insertDm.
  // Old clients ignore the unknown field; new clients use it as the
  // `up_to_id` cursor in DmMarkReadReq.
  int64 id = 5;
}

message UserPresence {
  string username = 1;
  string avatar_version = 2;   // '' when no avatar set
}

// Wire-breaking change from `repeated string online_users = 1;` —
// each online user now carries their current avatar_version so
// clients can detect cache misses without an explicit poll.
message PresenceUpdate {
  repeated UserPresence users = 1;
}

message ServerListRequest {
}

message CommunityServerInfo {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string host_ip = 4;
  int32 port = 5;
  int32 member_count = 6;
  // sha256-hex of the server picture; '' when no picture is set.
  // Propagates through LoginResponse.memberships and
  // ServerListResponse.servers so clients know up-front which tiles
  // have a picture set.
  string picture_version = 7;
}

message ServerListResponse {
  repeated CommunityServerInfo servers = 1;
}

// --- Friend System Messages ---

enum FriendActionType {
  ADD = 0;
  REMOVE = 1;
  BLOCK = 2;
  ACCEPT = 3;
  REJECT = 4;
}

message FriendActionReq {
  FriendActionType action = 1;
  string target_username = 2;
}

message FriendActionRes {
  bool success = 1;
  string message = 2;
}

message FriendInfo {
  string username = 1;
  enum Status {
    ONLINE = 0;
    OFFLINE = 1;
    PENDING_INCOMING = 2;
    PENDING_OUTGOING = 3;
    BLOCKED = 4;
  }
  Status status = 2;
  string avatar_version = 3;       // '' when no avatar set
}

message FriendListReq {
}

message FriendListRes {
  repeated FriendInfo friends = 1;
}

// --- Community Server Messages ---

message ChannelInfo {
  string id = 1;
  string name = 2;
  // CATEGORY rows are grouping headers living in the same ordered list
  // as channels (Discord's flat model): a channel's category is the
  // nearest CATEGORY row above it in position order; channels before
  // the first category are uncategorized. Categories can't nest, carry
  // no messages, and ignore the retention/bitrate fields.
  enum Type { TEXT = 0; VOICE = 1; CATEGORY = 2; }
  Type type = 3;
  // Opus bitrate (kbps) for voice channels. 0 / unset means "use client default".
  int32 voice_bitrate_kbps = 4;
  // Per-channel retention in days. 0 = keep forever.
  // Text retention governs the message row itself; attachment retentions
  // soft-delete the attachment blob while leaving a tombstone row so the
  // client can render "file X was cleaned up after N days".
  int32 retention_days_text = 5;
  int32 retention_days_image = 6;
  int32 retention_days_video = 7;
  int32 retention_days_document = 8;
  int32 retention_days_audio = 9;
}

message CommunityAuthRequest {
  string jwt_token = 1;
  // Optional — when present, the user joins the server (consuming the invite)
  // as part of the same authentication handshake. Required for non-members.
  string invite_code = 2;
}

message CommunityAuthResponse {
  bool success = 1;
  string message = 2;
  repeated ChannelInfo channels = 3;
  // Membership failure reason code:
  //   ""               -> success
  //   "not_member"     -> user is not a member and did not supply an invite
  //   "invalid_invite" -> supplied invite is unknown, expired, or used up
  //   "banned"         -> user is banned from this server
  //   "auth"           -> JWT invalid
  string error_code = 4;
  // Server metadata (populated on success)
  string server_name = 5;
  string server_description = 6;
  string owner_username = 7;
  // Maximum attachment size (bytes) this server accepts per upload.
  // 0 means unlimited. Clients use this to pre-validate before sending the
  // init request; server enforces authoritatively.
  int64 max_attachment_bytes = 8;
  // Port for the HTTP attachment endpoint (upload/download). Typically
  // community server TCP port + 3. 0 means "feature not available".
  int32 attachment_port = 9;
  // Central-assigned community_servers.id, learned by the community via
  // SERVER_HEARTBEAT_RES. Lets a client that connected through an invite
  // (knowing only host:port) re-key the connection onto the same id the
  // central directory / memberships use, so the server doesn't exist
  // twice in the UI. 0 = not yet learned (client keeps its own key).
  int64 server_id = 10;
}

message ChannelMessage {
  string sender = 1;
  string channel_id = 2;
  string content = 3;
  int64 timestamp = 4;
  // Server-assigned monotonic id (used as pagination cursor and dedupe key).
  // Zero when a client is sending; server populates before broadcast + persist.
  int64 id = 5;
  // Attachments associated with this message. Ordered by position ASC.
  repeated Attachment attachments = 6;
  // Client-generated UUID for optimistic-bubble dedup. Server echoes
  // this back unchanged in the broadcast — never persisted, just round-
  // tripped within the broadcast that fires within milliseconds of
  // CHANNEL_MSG arrival. Empty for messages re-fetched from history
  // (the originating client is long gone, no optimistic to dedup).
  string nonce = 7;
}

message Attachment {
  // Attachment kind — aligns with retention_days_{image,video,document,audio}.
  enum Kind {
    IMAGE = 0;
    VIDEO = 1;
    DOCUMENT = 2;
    AUDIO = 3;
  }
  int64 id = 1;
  int64 message_id = 2;
  Kind kind = 3;
  string filename = 4;
  string mime = 5;
  int64 size_bytes = 6;
  // Relative URL or storage identifier; empty when the attachment has been
  // purged by retention (tombstone row preserved for client rendering).
  string url = 7;
  int32 position = 8;
  int64 created_at = 9;
  // 0 = still present. Nonzero = unix seconds when retention removed the blob.
  int64 purged_at = 10;
  // Intrinsic pixel dimensions for image/video attachments. 0 = unknown
  // (older row or non-image kind). Clients use these to reserve the right
  // amount of space on first render so the data URL loading in later
  // doesn't cause a layout shift.
  uint32 width = 11;
  uint32 height = 12;
  // Total bytes across all server-stored JPEG thumbnails for this
  // attachment. 0 = no thumbnails (audio/document, or pre-thumbnail
  // upload). Clients use the presence (>0) to know whether to lazy-
  // fetch via GET /attachments/:id?variant=thumb[&size=N].
  uint32 thumbnail_size_bytes = 13;
  // Bitmask of pre-generated thumbnail sizes that exist on the server.
  // bit 0 = 320 px long-edge, bit 1 = 640 px, bit 2 = 1280 px. 0 with
  // thumbnail_size_bytes > 0 means a legacy single-size upload (320 px,
  // served from .thumb.jpg without the new naming).
  uint32 thumbnail_sizes_mask = 14;
  // Duration in milliseconds for audio + video attachments. Read at
  // upload time client-side and shipped in /attachments/init so chat
  // UIs can show "0:00 / 3:45" before the file is downloaded. 0 =
  // unknown (legacy row, non-media kind, or extraction failed).
  uint32 duration_ms = 15;
  // ThumbHash placeholder for image/video attachments — ~25 opaque
  // bytes the uploader computes from the same decoded bitmap it makes
  // thumbnails from, shipped in /attachments/init. The server never
  // interprets it; it stores and echoes the blob.
  //
  // Lets a viewer paint a blurred preview of the image with *zero*
  // requests, so a message scrolling into view is never an empty box.
  // Prefetching (client-side) covers rows near the viewport; this
  // covers the cases it can't — the first screen of a channel, and a
  // fling that outruns the prefetch window.
  //
  // Empty = unavailable: a pre-thumbhash upload, a non-image kind, or
  // an encoder failure. Clients fall back to a flat surface fill.
  //
  // Carried as base64 rather than `bytes` so it stays opaque the whole
  // way: the community server and the native client both move it as a
  // plain string with no codec dependency, and only the renderer — the
  // one place that decodes it — needs to know the format. ~34 bytes on
  // the wire instead of 25, which is not worth a base64 implementation
  // in two more languages.
  string placeholder = 16;
}

// --- Channel management ---
// The channel `id` is a server-generated slug of the name (unique,
// filesystem-safe — it doubles as the attachment directory name) and is
// immutable; renames change only the display name.

message ChannelCreateRequest {
  string name = 1;
  ChannelInfo.Type type = 2;
  // Voice channels only. 0 = "use client default".
  int32 voice_bitrate_kbps = 3;
  // Where the new channel lands: the id of an existing CATEGORY row to
  // append inside (end of its block), or "" to append at the end of
  // the uncategorized area (before the first category). Ignored when
  // creating a category — categories always append at the very end.
  string category_id = 4;
}

message ChannelDeleteRequest {
  string channel_id = 1;
}

message ChannelRenameRequest {
  string channel_id = 1;
  string name = 2;
}

message ChannelActionResponse {
  bool success = 1;
  string message = 2;
  // "create" | "rename" | "delete"
  string action = 3;
  // Populated on successful create/rename.
  ChannelInfo channel = 4;
}

// Full ordered channel list, pushed to every member after any create /
// rename / delete so sidebars stay authoritative without a reconnect.
// Clients replace their local list wholesale (and drop cached state for
// channels that disappeared).
message ChannelListUpdate {
  repeated ChannelInfo channels = 1;
}

// The complete new sidebar order (channels + categories, one flat
// list) after a drag-reorder. The id set must exactly match the
// server's current channel set — the server rewrites positions 0..N-1
// in one transaction and pushes CHANNEL_LIST_UPDATE, so a concurrent
// create/delete makes the reorder fail cleanly instead of silently
// dropping rows.
message ChannelReorderRequest {
  repeated string channel_ids = 1;
}

// Sets (or clears, with an empty nickname) a member's display nickname.
// Self-changes are always allowed; changing someone else's requires
// MANAGE_NICKNAMES and a strictly higher role. Result rides
// MOD_ACTION_RES with action="nickname".
message SetNicknameRequest {
  string username = 1;
  string nickname = 2;
}

message ChannelHistoryRequest {
  string channel_id = 1;
  // Return messages with id < before_id. 0 means "most recent".
  int64 before_id = 2;
  // Server-enforced cap (hard max regardless of client value).
  int32 limit = 3;
}

message ChannelHistoryResponse {
  string channel_id = 1;
  // Ordered from oldest to newest within the page.
  repeated ChannelMessage messages = 2;
  // True when more messages exist older than the oldest one returned.
  bool has_more = 3;
}

message ChannelUpdateRequest {
  string channel_id = 1;
  // All five retention values — client sends the full snapshot. 0 = forever.
  int32 retention_days_text = 2;
  int32 retention_days_image = 3;
  int32 retention_days_video = 4;
  int32 retention_days_document = 5;
  int32 retention_days_audio = 6;
  // Voice channels only: Opus bitrate in kbps, 0 = "use client
  // default". `optional` for explicit presence — absent (older
  // clients / text-channel updates) means "leave unchanged", so a
  // retention-only update can never silently reset the bitrate.
  // Applied by clients on their next voice join.
  optional int32 voice_bitrate_kbps = 7;
}

message ChannelUpdateResponse {
  bool success = 1;
  string message = 2;
  // Echo of the updated channel so clients can refresh their local copy.
  ChannelInfo channel = 3;
}

message AttachmentTombstone {
  int64 attachment_id = 1;
  int64 purged_at = 2;
}

message ChannelPruned {
  string channel_id = 1;
  // Message rows fully removed by text retention.
  repeated int64 deleted_message_ids = 2;
  // Attachments soft-deleted into tombstones (blob gone, metadata retained).
  repeated AttachmentTombstone purged_attachments = 3;
}

// Owner-initiated full wipe of a channel's history. Sent by the
// requesting client; the server validates ownership before acting.
message ChannelWipeRequest {
  string channel_id = 1;
}

// Reply to the requesting client only. Counts let the UI show
// confirmation feedback without re-fetching history.
message ChannelWipeResponse {
  bool success = 1;
  string message = 2;
  string channel_id = 3;
  int64 deleted_message_count = 4;
  int64 deleted_attachment_count = 5;
}

// Broadcast to every authenticated session after a successful wipe.
// Lets clients drop the channel's locally-cached message state without
// shipping every deleted message id over the wire.
message ChannelWiped {
  string channel_id = 1;
  // Wall-clock unix seconds when the wipe completed.
  int64 wiped_at = 2;
  string wiped_by = 3;
}

message JoinVoiceRequest {
  string channel_id = 1;
  // Capabilities of the joining client. Empty when sent by an older
  // client that pre-dates negotiation; server treats that as "H.264
  // decode/encode only, conservative ceilings" for back-compat.
  ClientCapabilities capabilities = 2;
}

message LeaveVoiceRequest {
}

message VoiceUserState {
  string username = 1;
  bool is_muted = 2;
  bool is_deafened = 3;
}

message VoicePresenceUpdate {
  string channel_id = 1;
  repeated string active_users = 2;
  repeated VoiceUserState user_states = 3;
  // Parallel to user_states/active_users — same length, same order.
  // user_capabilities[i] belongs to active_users[i].
  repeated ClientCapabilities user_capabilities = 4;
}

message VoiceStateNotify {
  bool is_muted = 1;
  bool is_deafened = 2;
}

message VideoStreamInfo {
  string stream_id = 1;
  string owner_username = 2;
  bool has_audio = 3;
  uint32 resolution_width = 4;
  uint32 resolution_height = 5;
  uint32 fps = 6;
  // Live current codec. Changes mid-stream when the streamer renegotiates.
  VideoCodec current_codec = 7;
  // CODEC_UNKNOWN if the streamer chose Auto. Drives the lock badge
  // and the grayed-out watch button.
  VideoCodec enforced_codec = 8;
  // Number of watchers currently subscribed to this stream. Derived from the
  // server's stream_watchers_ set on each presence broadcast; defaults to 0 for
  // old clients/servers.
  uint32 watcher_count = 9;
}

message StreamPresenceUpdate {
  string channel_id = 1;
  repeated VideoStreamInfo active_streams = 2;
}

message StartStreamRequest {
  string channel_id = 1;
  int32 target_fps = 2;
  int32 target_bitrate_kbps = 3;
  bool has_audio = 4;
  uint32 resolution_width = 5;
  uint32 resolution_height = 6;
  // Codec the streamer is starting with. Auto-picked from the streamer's
  // encode caps (filtered by user toggles) when enforced_codec is UNKNOWN.
  VideoCodec chosen_codec = 7;
  // CODEC_UNKNOWN = no enforcement, auto-negotiation enabled.
  // Anything else = streamer locks the stream to this codec; viewers
  // without it see a grayed-out watch button (computed locally).
  VideoCodec enforced_codec = 8;
}

message StopStreamRequest {
  string channel_id = 1;
}

message WatchStreamRequest {
  string channel_id = 1;
  string target_username = 2;
}

message StopWatchingRequest {
  string channel_id = 1;
  string target_username = 2;
}

message StreamThumbnailUpdate {
  string channel_id = 1;
  string owner_username = 2;
  bytes thumbnail_data = 3;
}

message DmPrivacySetting {
  bool friends_only = 1;
}

message ServerHeartbeat {
  string name = 1;
  string description = 2;
  string host_ip = 3;
  int32 port = 4;
  int32 member_count = 5;
}

// --- Invites + Membership ---

message InviteInfo {
  string code = 1;
  string created_by = 2;
  int64 created_at = 3;
  int64 expires_at = 4;     // 0 = never
  int32 max_uses = 5;       // 0 = unlimited
  int32 uses = 6;
}

message InviteCreateRequest {
  // 0 means "never"
  int64 expires_at = 1;
  // 0 means "unlimited"
  int32 max_uses = 2;
}

message InviteCreateResponse {
  bool success = 1;
  string message = 2;
  InviteInfo invite = 3;
}

message InviteListRequest {}

message InviteListResponse {
  bool success = 1;
  string message = 2;
  repeated InviteInfo invites = 3;
}

message InviteRevokeRequest {
  string code = 1;
}

message InviteRevokeResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
}

message MemberInfo {
  string username = 1;
  int64 joined_at = 2;
  string nickname = 3;
  bool is_owner = 4;
  bool is_online = 5;
  // Ids of the roles assigned to this member (the default `everyone`
  // role is implicit and never listed). Clients resolve them against
  // RoleListResponse to compute display color and permissions.
  repeated int64 role_ids = 6;
}

message MemberListRequest {}

message MemberListResponse {
  bool success = 1;
  string message = 2;
  repeated MemberInfo members = 3;
  repeated string bans = 4;
}

// --- Roles + permissions ---
// RoleInfo.permissions is an OR of these bit values. The values are part
// of the wire contract — never renumber, only append new bits. Bits kept
// below 2^53 so JavaScript clients can treat the field as a plain number.
//
// Semantics:
//   PERM_ADMINISTRATOR grants everything below (but NOT hierarchy bypass:
//   role management and kick/ban still require the actor's highest role
//   to sit above the role/member being acted on; only the owner bypasses
//   hierarchy).
//   The three reserved bits are defined now so their values are stable,
//   but the server does not enforce them yet — they default ON in the
//   seeded `everyone` role so enforcement can ship later without a
//   migration.
enum Permission {
  PERM_NONE             = 0;
  PERM_ADMINISTRATOR    = 1;     // 1<<0  — all permissions
  PERM_MANAGE_SERVER    = 2;     // 1<<1  — server name/description/picture
  PERM_MANAGE_CHANNELS  = 4;     // 1<<2  — retention settings, wipe (create/delete later)
  PERM_MANAGE_ROLES     = 8;     // 1<<3  — create/edit/delete/assign roles below own highest
  PERM_KICK_MEMBERS     = 16;    // 1<<4
  PERM_BAN_MEMBERS      = 32;    // 1<<5  — ban/unban + see the ban list
  PERM_MANAGE_MESSAGES  = 64;    // 1<<6  — delete other members' messages
  PERM_MANAGE_INVITES   = 128;   // 1<<7  — create/list/revoke invites
  PERM_MANAGE_NICKNAMES = 256;   // 1<<8  — reserved (ships with nickname editing)
  PERM_SEND_MESSAGES    = 1024;  // 1<<10 — reserved, default-on
  PERM_CONNECT_VOICE    = 2048;  // 1<<11 — reserved, default-on
  PERM_STREAM           = 4096;  // 1<<12 — reserved, default-on
}

message RoleInfo {
  int64 id = 1;
  string name = 2;
  // 0xRRGGBB display color; 0 = default (no color).
  uint32 color = 3;
  // Dense hierarchy position, higher = more senior. 0 is reserved for
  // the default `everyone` role; real roles occupy 1..N with no gaps.
  int32 position = 4;
  uint64 permissions = 5;
  // True only for the seeded `everyone` role: undeletable, unmovable,
  // implicit on every member; only its permissions can be edited.
  bool is_default = 6;
}

message RoleListRequest {}

message RoleListResponse {
  bool success = 1;
  string message = 2;
  // Ordered most-senior first (position DESC); `everyone` last.
  repeated RoleInfo roles = 3;
}

message RoleCreateRequest {
  string name = 1;
  uint32 color = 2;
  uint64 permissions = 3;
  // New roles are always inserted at position 1 (just above `everyone`);
  // move them afterwards with RoleUpdateRequest.position.
}

// Full snapshot — the client sends every field (it has the current role
// from RoleListResponse). position is clamped server-side to [1, N] and
// to strictly below the actor's own highest role.
message RoleUpdateRequest {
  int64 role_id = 1;
  string name = 2;
  uint32 color = 3;
  uint64 permissions = 4;
  int32 position = 5;
}

message RoleDeleteRequest {
  int64 role_id = 1;
}

message RoleActionResponse {
  bool success = 1;
  string message = 2;
  // "create" | "update" | "delete" | "assign"
  string action = 3;
  // Populated on successful create/update so the requester can resolve
  // the server-assigned id without waiting for the ROLE_LIST_RES push.
  RoleInfo role = 4;
}

// Replaces the target member's entire role set (the default role is
// implicit and must not be listed). Requires MANAGE_ROLES, and every
// role being added or removed must sit strictly below the actor's
// highest role.
message MemberRolesUpdateRequest {
  string username = 1;
  repeated int64 role_ids = 2;
}

message UnbanMemberRequest {
  string username = 1;
}

message KickMemberRequest {
  string username = 1;
  string reason = 2;
}

message BanMemberRequest {
  string username = 1;
  string reason = 2;
}

message ModActionResponse {
  bool success = 1;
  string message = 2;
  // Echo of the username that was acted upon, so the client can resolve
  // which request this response corresponds to.
  string username = 3;
  // "kick" | "ban" | "unban" | "leave"
  string action = 4;
}

message LeaveServerRequest {}

message ServerMetaUpdate {
  string server_name = 1;
  string server_description = 2;
  string owner_username = 3;
}

message MembershipRevoked {
  // "kick" | "ban"
  string action = 1;
  string reason = 2;
  string actor = 3;
}

// --- Central-hosted invite lookup ---
// Community servers register each live invite with the central server so
// clients can redeem a raw code without knowing the community host:port.

message InviteRegisterRequest {
  string code = 1;
  string host = 2;
  uint32 port = 3;
  int64 expires_at = 4;  // 0 = never
}

message InviteUnregisterRequest {
  string code = 1;
}

message InviteResolveRequest {
  string code = 1;
}

message InviteResolveResponse {
  bool success = 1;
  string message = 2;
  string host = 3;
  uint32 port = 4;
  // Echoed so the client can correlate concurrent lookups.
  string code = 5;
}

// --- Video codec negotiation messages ---

// Sent by the streamer when it switches codec/resolution/fps mid-stream.
// Server validates the sender owns the stream, updates the registry
// entry, and rebroadcasts StreamPresenceUpdate to the channel.
message StreamCodecChangedNotify {
  string channel_id = 1;
  string streamer_username = 2;
  VideoCodec new_codec = 3;
  uint32 new_width = 4;
  uint32 new_height = 5;
  uint32 new_fps = 6;
  enum Reason {
    REASON_UNKNOWN = 0;
    WATCHER_JOINED_LOW_CAPS = 1;
    LIMITING_WATCHER_LEFT = 2;
    STREAMER_INITIATED = 3;
  }
  Reason reason = 7;
}

// Sent by a client mid-session when the user clicks "Refresh codec
// capabilities" in Settings. Server stores the new caps on the session
// and rebroadcasts VoicePresenceUpdate so peers see the change without
// the user having to leave and rejoin the voice channel.
message UpdateCapabilitiesRequest {
  ClientCapabilities capabilities = 1;
}

// Sent by the community server to the streamer when a watcher joins or
// leaves their stream (or disconnects from voice while watching). The
// streamer uses this to drive the LCD picker and decide whether to
// renegotiate the codec. Only the stream owner receives this — other
// channel members don't need to know.
message StreamWatcherNotify {
  string channel_id = 1;
  string streamer_username = 2;
  string watcher_username = 3;
  enum Action {
    ACTION_UNKNOWN = 0;
    JOINED = 1;
    LEFT = 2;
  }
  Action action = 4;
}

// --- Avatar Messages ---
// Per-user profile pictures stored on central. Bytes are validated as
// JPEG (magic 0xFF 0xD8) and capped at 200 KB on the server. Version
// is sha256-hex of the bytes (empty string when no avatar). Clients
// cache by (username, version); AvatarChanged broadcasts invalidate.
// See docs/superpowers/specs/2026-05-12-custom-profile-pictures-design.md.

message UpdateAvatarReq {
  bytes data = 1;       // empty = remove; otherwise JPEG bytes, max 1 MB
}

message UpdateAvatarRes {
  bool success = 1;
  string message = 2;
  string version = 3;   // sha256-hex; '' on removal
}

message FetchAvatarReq {
  string username = 1;
}

message FetchAvatarRes {
  string username = 1;
  string version = 2;   // '' when user has no avatar
  bytes data = 3;       // empty when version == ''
}

message AvatarChanged {
  string username = 1;
  string version = 2;   // '' on removal
}

// On-demand fetch of the latest thumbnail for a currently-streaming user.
// Sent by the client when a UserProfilePopup opens for a user who's known
// to be streaming. The community server keeps the most recent thumbnail
// in `latest_thumbnails_` and replies with the JPEG bytes (or empty if
// no frame has arrived yet).
message FetchStreamThumbnailReq {
  string owner_username = 1;
}

message FetchStreamThumbnailRes {
  string owner_username = 1;
  bytes thumbnail_data = 2;  // empty when no thumbnail cached yet
}

// --- Persistent DMs ---
// (see docs/superpowers/specs/2026-05-14-persistent-dms-design.md)

message DmConversationsReq {}

message DmConversationPreview {
  string peer = 1;
  string last_message_content = 2;
  string last_message_sender = 3;  // either the local user or the peer
  int64  last_message_id = 4;
  int64  last_timestamp = 5;
  int64  unread_count = 6;
}
message DmConversationsRes {
  repeated DmConversationPreview conversations = 1;
}

message DmHistoryReq {
  string peer = 1;
  int64  before_id = 2;   // 0 = latest
  int32  limit = 3;       // server clamps to 200
}
message DmHistoryMessage {
  int64  id = 1;
  string sender = 2;
  string content = 3;
  int64  timestamp = 4;
}
message DmHistoryRes {
  string peer = 1;
  repeated DmHistoryMessage messages = 2;  // newest first
  bool   has_more = 3;
}

message DmMarkReadReq {
  string peer = 1;
  int64  up_to_id = 2;
}

// --- Auto-rejoin community memberships ---
// See docs/superpowers/specs/2026-05-14-auto-rejoin-communities-design.md
// (+ plan amendment: SERVER_HEARTBEAT_RES exists so the community can
// learn its central-assigned server_id at startup).

message MembershipRegisterReq {
  string username = 1;
  int64  server_id = 2;
}

message MembershipRevokeReq {
  string username = 1;
  int64  server_id = 2;
}

// Sent by central in response to a SERVER_HEARTBEAT, over the same
// one-shot TLS connection. Lets the community learn its
// central-assigned server_id (community_servers.id) so it can
// populate Membership{Register,Revoke}Req on future packets.
message ServerHeartbeatRes {
  int64 server_id = 1;
}

// --- Message deletion ---
// See docs/superpowers/specs/2026-05-15-message-deletion-design.md

message DmDeleteReq {
  string peer = 1;
  int64  message_id = 2;
}

message DmDeleteRes {
  bool   success = 1;
  string message = 2;
  string peer = 3;
  int64  message_id = 4;
}

// Peer field is rewritten by central per recipient — always "the
// other user" from the receiving session's perspective.
message DmMessageDeleted {
  string peer = 1;
  int64  message_id = 2;
  int64  deleted_at = 3;
}

message MessageDeleteReq {
  string channel_id = 1;
  int64  message_id = 2;
}

message MessageDeleteRes {
  bool   success = 1;
  string message = 2;
  string channel_id = 3;
  int64  message_id = 4;
}

message ChannelMessageDeleted {
  string channel_id = 1;
  int64  message_id = 2;
  int64  deleted_at = 3;
  // For future audit-log surfacing; not consumed by current UI.
  string deleted_by = 4;
}

// --- Custom server pictures ---
// See docs/superpowers/specs/2026-05-15-custom-server-pictures-design.md

message UpdateServerPictureReq {
  bytes data = 1;   // empty = remove
}

message UpdateServerPictureRes {
  bool   success = 1;
  string message = 2;
  string version = 3;   // sha256-hex; '' on removal or failure
}

message SyncServerPictureReq {
  string host = 1;
  int32  port = 2;
  bytes  data = 3;
  string version = 4;   // pre-computed by community
}

message FetchServerPictureReq {
  int32 server_id = 1;
}

message FetchServerPictureRes {
  int32  server_id = 1;
  string version = 2;
  bytes  data = 3;
}

message ServerPictureChanged {
  int32  server_id = 1;
  string version = 2;
}
