[package]
name = "decibell-native"
version = "0.0.1"
edition = "2021"
license = "Proprietary"
publish = false

# The Electron addon: a thin napi layer over crates/decibell-core (init /
# shutdown, the napi event sink, the #[napi] commands). Everything else —
# connections, media, E2EE, hotkeys, settings — and its dependencies live in
# the core crate. This crate stays the build root: its Cargo.lock, target/,
# .cargo/config.toml (the static FFmpeg's PKG_CONFIG_PATH) and [profile]s
# apply to the core when the addon is built.

[lib]
crate-type = ["cdylib"]

[dependencies]
decibell-core = { path = "../../crates/decibell-core" }
napi = { version = "2", default-features = false, features = ["napi9", "tokio_rt", "serde-json", "async"] }
napi-derive = { version = "2", features = ["type-def"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
cpal = "0.15"
ring = "0.17"
# P2P DM calls: local interface enumeration for host candidates
# (commands/call.rs).
if-addrs = "0.13"

# on_load clears O_NONBLOCK on stdout / stderr (lib.rs), Linux and macOS.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# DXGI adapter enumeration for the encoder vendor order
# (commands/streaming.rs read_primary_gpu_vendor_id). The core crate turns on
# the rest of the windows crate's features.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }

[dev-dependencies]
# commands/voice.rs tests decode the packets a join sends.
prost = "0.13"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1

[features]
# Both live in the core crate (crates/decibell-core/Cargo.toml); forwarded so
# `npx napi build --features …` keeps working from here.
# DECIBELL_STREAM_DUMP (core src/media/stream_dump.rs): record watched streams to .dbv files for the Qt client's
# video spike. Off in every shipped build; opt in with `npx napi build --platform --release --features stream-dump`.
stream-dump = ["decibell-core/stream-dump"]
# DECIBELL_CENTRAL=host:port in an optimised build (core src/net/central.rs), for tests and measurements against
# the local servers of src/server/tests + src/community/tests. Off in every shipped build.
local-central = ["decibell-core/local-central"]
