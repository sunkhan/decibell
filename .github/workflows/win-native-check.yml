name: Windows Native Check

# Compile-checks the cfg(target_os = "windows") half of the native
# addon (electron-client/native + the crates/decibell-core it builds on),
# which the Linux dev box can't build (`cargo test --lib` only covers the
# host cfg). Runs on pushes touching either so a Windows compile break
# surfaces before the next `ev*` release tag, and the full compiler
# output is uploaded as an artifact — run logs need admin-scoped tokens
# to download, artifacts don't.

on:
  workflow_dispatch:
  push:
    branches: [main, gpui-client]
    paths:
      - "electron-client/native/**"
      - "crates/**"
      - "gpui-client/**"
      - "proto/messages.proto"
      - ".github/workflows/win-native-check.yml"

permissions:
  # write: the last step publishes the compiler output to the
  # ci/win-native-check-log branch (see below).
  contents: write

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-client/native

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: electron-client/native
          shared-key: win-native-check

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # vcpkg's binary cache: the FFmpeg port build is most of the job's
      # wall clock (~20 min uncached). Keyed on the pinned vcpkg commit +
      # triplet so a re-pin invalidates it.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-ffmpeg-e5a1490e-x64-windows

      # Same pinned vcpkg commit as electron-release.yml — ffmpeg-sys's
      # build script needs the FFmpeg libs even for `cargo check`.
      - name: Install FFmpeg via vcpkg
        shell: pwsh
        run: |
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --quiet origin
          git -C "$env:VCPKG_INSTALLATION_ROOT" checkout e5a1490e1409d175932ef6014519e9ae149ddb7c
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "ffmpeg[nvcodec,amf,qsv]:x64-windows"
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: cargo check
        id: check
        shell: bash
        env:
          # audiopus_sys vendors a libopus whose CMakeLists says
          # cmake_minimum_required(VERSION 3.1); CMake 4.x on the runner
          # refuses that without this shim (same as electron-release.yml).
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        # Two checks, one log. The addon: `--all-targets` reaches only its
        # own package, so decibell-core (a path dependency) is checked
        # there as a plain lib. Then decibell-core on its own, tests
        # included (its cfg(windows) test code lives there now), against
        # its own Cargo.lock but the addon's target dir, so the
        # dependencies built by the first check are reused.
        run: |
          set -o pipefail
          status=0
          cargo check --locked --all-targets 2>&1 | tee cargo-check.log || status=1
          ( cd ../../crates/decibell-core \
            && CARGO_TARGET_DIR=../../electron-client/native/target cargo check --locked --all-targets ) \
            2>&1 | tee -a cargo-check.log || status=1
          exit $status

      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-cargo-check-log
          path: electron-client/native/cargo-check.log
          if-no-files-found: ignore

      # Artifacts and run logs both need an authenticated token to
      # download; a branch can be fetched over plain git/SSH. Force-push
      # the log as an orphan commit on ci/win-native-check-log so the dev
      # box reads it with:
      #   git fetch origin ci/win-native-check-log
      #   git show FETCH_HEAD:cargo-check.log
      - name: Publish compiler output to ci/win-native-check-log
        if: always()
        shell: bash
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -e
          rm -rf /tmp/win-check-log && mkdir -p /tmp/win-check-log
          if [ -f electron-client/native/cargo-check.log ]; then
            cp electron-client/native/cargo-check.log /tmp/win-check-log/
          else
            echo "(no cargo-check.log — a step before cargo check failed)" > /tmp/win-check-log/cargo-check.log
          fi
          cd /tmp/win-check-log
          printf 'run=%s\nsha=%s\noutcome=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$CHECK_OUTCOME" > meta.txt
          git init -q
          git config user.name "decibell-ci"
          git config user.email "ci@decibell.invalid"
          git checkout -q -b ci/win-native-check-log
          git add -A
          git commit -q -m "win-native-check ${GITHUB_SHA} (${CHECK_OUTCOME})"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/win-native-check-log

  # The GPUI client (gpui-client/): compile-checks its workspace for Windows, where GPUI
  # uses another backend (gpui_windows: Direct3D 11 + DirectWrite) than on the Linux dev
  # box. The workspace reaches crates/decibell-core (through decibell-model), so it needs
  # protoc and FFmpeg exactly as the job above; a debug `cargo check` does not need
  # fxc.exe (release builds compile GPUI's HLSL shaders with it). Output goes to
  # ci/win-gpui-check-log, like the job above.
  gpui-client:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gpui-client

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gpui-client
          shared-key: win-gpui-check

      # The pinned Zed clone and the patched copy cargo builds GPUI from. On a hit
      # fetch-gpui.sh finds its stamp and does nothing, which also keeps the sources'
      # timestamps, so cargo does not rebuild GPUI.
      - name: Cache the patched GPUI sources
        uses: actions/cache@v4
        with:
          path: |
            gpui-client/vendor/zed
            gpui-client/vendor/gpui-src
            gpui-client/vendor/gpui-src.stamp
          key: gpui-src-${{ hashFiles('gpui-client/GPUI_PIN', 'gpui-client/patches/*.patch', 'gpui-client/tools/fetch-gpui.sh') }}

      - name: Fetch and patch GPUI
        shell: bash
        run: tools/fetch-gpui.sh

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The same pinned vcpkg as the job above, but the client's FFmpeg: the overlay ports in
      # gpui-client/tools/vcpkg-overlay add the SVT-AV1 software encoder (`svt-av1`, SVT-AV1
      # 4.2.0) and `dav1d` (the AV1 software decoder); decibell-app's build.rs refuses an
      # FFmpeg without them. Its own binary cache: the overlay changes the packages' ABI hashes,
      # and a key shared with the addon job would keep whichever job saved first.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-ffmpeg-e5a1490e-svtav1-x64-windows-${{ hashFiles('gpui-client/tools/vcpkg-overlay/**') }}

      - name: Install FFmpeg via vcpkg
        shell: pwsh
        run: |
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --quiet origin
          git -C "$env:VCPKG_INSTALLATION_ROOT" checkout e5a1490e1409d175932ef6014519e9ae149ddb7c
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "ffmpeg[nvcodec,amf,qsv,dav1d,svt-av1]:x64-windows" `
            "--overlay-ports=$env:GITHUB_WORKSPACE\gpui-client\tools\vcpkg-overlay"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: cargo check
        id: check
        shell: bash
        env:
          # As above: audiopus_sys's vendored libopus and CMake 4.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        # The workspace with its tests, then the capture tool behind its feature (it is
        # not a default target, so that GPUI's test-support stays out of `decibell`).
        run: |
          set -o pipefail
          status=0
          cargo check --locked --workspace --all-targets 2>&1 | tee cargo-check.log || status=1
          cargo check --locked -p decibell-app --features capture --all-targets 2>&1 \
            | tee -a cargo-check.log || status=1
          exit $status

      # From here on the job *runs* things, which the check above cannot: none of these steps
      # fails the job (the compile check is the gate) and each writes a log that is published
      # with the compiler output. A hosted runner has no GPU: Direct3D 11 is WARP there
      # ("Microsoft Basic Render Driver"), which draws but has no video decoder.

      # GPUI's HLSL is compiled by fxc.exe only in release builds (debug builds compile it at
      # run time): a release check of gpui_windows runs its build script, fxc included.
      - name: Compile the shaders (fxc)
        if: always() && steps.check.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked --release -p gpui_windows 2>&1 | tee shaders.log

      # Unit tests of the crates that need no core: text, rich text, highlighter, TeX, theme,
      # attachments, unfurl, the kit, the picture editor, the harness, and the video crate
      # (software decode of the frames compiled into it; FFmpeg's DLLs come from vcpkg).
      - name: Unit tests (crates without the core)
        if: always() && steps.check.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -o pipefail
          export PATH="$(cygpath "$VCPKG_ROOT")/installed/x64-windows/bin:$PATH"
          : > unit-tests.log
          for crate in decibell-theme decibell-highlight decibell-tex decibell-richtext \
              decibell-attachments decibell-unfurl decibell-harness decibell-text decibell-ui \
              decibell-picture-editor decibell-video; do
            echo "=== cargo test -p $crate" | tee -a unit-tests.log
            cargo test --locked -p "$crate" 2>&1 | tee -a unit-tests.log \
              || echo "=== FAILED: $crate" | tee -a unit-tests.log
          done

      # The client's own self-tests that need neither a server nor a hardware codec, in its
      # real window on the runner's desktop: first frame and fonts, 0 frames and a sleeping
      # main thread at rest (GPUI patch 0021), themes, the kit, the text field, the chat list
      # from its fixture, and `video-probe` (software decode into Direct3D textures, a row read
      # back, the surface drawn: GPUI patch 0020 and the video crate's Windows backend on
      # WARP). One process per group, so a crash or a hang costs one group.
      # A hosted runner's desktop is 1024 x 768: the client's 1280 x 800 window does not fit and
      # opens at 1024 x 720, where fixtures laid out for the usual window put things off screen.
      - name: A desktop the window fits on
        if: always() && steps.check.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          "primary screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      # The executable itself: `cargo check` above never links. A link failure (2026-11-27: two
      # application manifests, "CVT1100 duplicate resource") must fail the job, not hide in the
      # self-tests' log as fifteen groups that could not start.
      - name: Build the app (links decibell.exe)
        id: build
        if: always() && steps.check.outcome == 'success'
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -o pipefail
          cargo build --locked -p decibell-app 2>&1 | tee build.log | tail -n 60
          test -f target/debug/decibell.exe

      - name: Self-tests
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          DECIBELL_LOG: info
          RUST_BACKTRACE: "1"
        run: |
          # Every group runs whatever the one before it returned (Actions' bash is `-e`).
          set +e
          export PATH="$(cygpath "$VCPKG_ROOT")/installed/x64-windows/bin:$PATH"
          export DECIBELL_USER_DATA_DIR="$RUNNER_TEMP/decibell-profile"
          : > selftests.log
          tail -n 20 build.log >> selftests.log
          for group in \
              "boot" \
              "idle-frames" \
              "themes,window-frame" \
              "video-probe" \
              "kit-idle,kit-switch,kit-select,kit-modal,kit-confirm,kit-scroll,kit-toast" \
              "input-typing,input-undo,input-ime,input-atoms,input-bytes-cap,input-select-filter,input-caret-idle" \
              "chat-history,chat-switch,chat-resize,chat-selection,chat-rows,chat-idle,chat-hover" \
              "chat-scroll-spec" \
              "input-clipboard,input-password" \
              "hotkeys-focused,hotkeys-layout" \
              "join-status-picker,join-dm-composer" \
              "picture-editor,settings-narrow,server-settings-idle" \
              "content-scroll-fixture,content-rows" \
              "profile-guard,single-instance,deep-link-arg,hotkey-cli,attention,taskbar-progress,keyring-label,window-state" \
              "render-cost,encoder-software"; do
            echo "=== decibell --selftest $group" | tee -a selftests.log
            timeout 600 target/debug/decibell.exe --selftest "$group" >> selftests.log 2>&1
            echo "=== exit $? ($group)" | tee -a selftests.log
          done
          # The same first frame without DirectComposition, in case the runner's session has
          # no compositor to give the window.
          echo "=== decibell --selftest boot (GPUI_DISABLE_DIRECT_COMPOSITION=1)" | tee -a selftests.log
          GPUI_DISABLE_DIRECT_COMPOSITION=1 timeout 600 target/debug/decibell.exe --selftest boot >> selftests.log 2>&1
          echo "=== exit $? (boot, no DirectComposition)" | tee -a selftests.log
          echo "=== summary" >> selftests.log
          grep -a -E '^selftest [a-z0-9-]+: (PASS|FAIL|SKIP)|^=== exit' selftests.log > selftests.summary
          cat selftests.summary | tee -a selftests.log
          exit 0

      # The window at rest, measured by the script the owner uses on a real machine
      # (tools/perf/windows/row.ps1, under Windows PowerShell 5.1 as there): the numbers of a
      # runner mean nothing, but a script that runs here and appends a well-formed row is a
      # verified script, and the per-thread table says whether the main thread and the vsync
      # thread ("VSyncProvider") sleep with nothing to draw (GPUI patch 0021): about 0 context
      # switches a second each, against the display's refresh rate without the patch.
      - name: Measure the window at rest
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $env:Path = "$env:VCPKG_ROOT\installed\x64-windows\bin;$env:Path"
          $env:DECIBELL_USER_DATA_DIR = "$env:RUNNER_TEMP\decibell-profile"
          # UTF-8, appended: Windows PowerShell's redirection and Tee-Object write UTF-16.
          function Log { process { $_ | Out-String -Stream | ForEach-Object { $_; Add-Content -Path idle.log -Value $_ -Encoding utf8 } } }
          Set-Content -Path idle.log -Value "tools/perf/windows/row.ps1 on the runner" -Encoding utf8
          if (-not (Test-Path target\debug\decibell.exe)) { "no binary" | Log; exit 0 }
          $process = Start-Process -FilePath target\debug\decibell.exe -ArgumentList '--perf','--screen','gallery' `
            -RedirectStandardError perf.log -PassThru
          try {
            ..\tools\perf\windows\row.ps1 -ProcessId $process.Id -Client gpui -Label "ci gallery at rest" `
              -PerfLog perf.log -Settle 20 -Seconds 20 -Results "$PWD\perf-results\windows-table.md" *>&1 | Log
            "--- the results file" | Log
            Get-Content perf-results\windows-table.md | Log
            "--- who wakes (threads.ps1)" | Log
            Get-ChildItem perf-results\*-threads.txt | ForEach-Object { Get-Content $_.FullName } | Log
            "--- install size" | Log
            ..\tools\perf\windows\install-size.ps1 target\debug\decibell.exe *>&1 | Log
          } catch {
            "row.ps1 failed: $_" | Log
            $_.ScriptStackTrace | Log
          }
          "--- the client's stderr" | Log
          Get-Content perf.log -ErrorAction SilentlyContinue | Select-Object -Last 40 | Log
          "alive: $(-not $process.HasExited)" | Log
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          exit 0

      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-gpui-check-log
          path: |
            gpui-client/idle.log
            gpui-client/cargo-check.log
            gpui-client/shaders.log
            gpui-client/unit-tests.log
            gpui-client/selftests.log
          if-no-files-found: ignore

      - name: Publish compiler output to ci/win-gpui-check-log
        if: always()
        shell: bash
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -e
          rm -rf /tmp/win-gpui-log && mkdir -p /tmp/win-gpui-log
          if [ -f gpui-client/cargo-check.log ]; then
            cp gpui-client/cargo-check.log /tmp/win-gpui-log/
          else
            echo "(no cargo-check.log: a step before cargo check failed)" > /tmp/win-gpui-log/cargo-check.log
          fi
          # What the job ran, when it got that far (see the steps above).
          for log in shaders.log unit-tests.log selftests.log idle.log; do
            if [ -f "gpui-client/$log" ]; then cp "gpui-client/$log" /tmp/win-gpui-log/; fi
          done
          cd /tmp/win-gpui-log
          printf 'run=%s\nsha=%s\noutcome=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$CHECK_OUTCOME" > meta.txt
          git init -q
          git config user.name "decibell-ci"
          git config user.email "ci@decibell.invalid"
          git checkout -q -b ci/win-gpui-check-log
          git add -A
          git commit -q -m "win-gpui-check ${GITHUB_SHA} (${CHECK_OUTCOME})"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/win-gpui-check-log
