[package]
name = "decibell-media"
description = "Playback of video and audio attachments: demux, hardware video decode through decibell-video's timed streams, audio on its own output stream, A/V sync to the audio clock"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Design reference: gpui-client/docs/media-design.md.
#
# FFmpeg is the client's one static prefix (tools/build-ffmpeg.sh -> vendor/ffmpeg), as in
# decibell-video; the demuxers and audio decoders this crate opens are listed there and checked
# by decibell-app's build script.

[dependencies]
decibell-panic.workspace = true
decibell-video.workspace = true
anyhow.workspace = true
log.workspace = true
parking_lot = "0.12"
# The version the core links (its voice output): one cpal in the binary.
cpal = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
ffmpeg-sys-next = { version = "8.1", default-features = false, features = ["avcodec", "avformat", "swresample", "static"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ffmpeg-sys-next = { version = "8.1", default-features = false, features = ["avcodec", "avformat", "swresample"] }

[[test]]
name = "alloc"
path = "tests/alloc.rs"
