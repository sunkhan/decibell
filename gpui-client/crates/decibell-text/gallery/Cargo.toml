description = "Capture and live-view screens for decibell-text (text roles, rich text)"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The engine itself knows no theme; these screens dress it in the app's (decibell-ui).
[dependencies]
gpui.workspace = true
decibell-text.workspace = true
