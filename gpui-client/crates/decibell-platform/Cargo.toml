[package]
name = "decibell-platform"
description = "The desktop around the window (what Electron's main process did that needs the OS): one instance per profile, decibell:// links and --hotkey from a second launch, attention, taskbar progress, the quit guard, the window's size and place, sleep and screen lock"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Development builds (the app's `dev-local`): one stdout line per platform event for the
# self-tests' parents (`decibell: platform …`), and XTEST for `idle-x11`'s input inside its private
# Xvfb. Never in a shipped build.
dev-local = ["x11rb/xtest"]

[dependencies]
gpui.workspace = true
decibell-model.workspace = true
decibell-ui.workspace = true
decibell-harness.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The window's native handle (Windows: the HWND that FlashWindowEx / ITaskbarList3 take).
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The launcher progress (com.canonical.Unity.LauncherEntry) and the screen saver's lock signal. On
# async-io, as GPUI's own D-Bus users run (HANDOFF.md §5, "zbus features").
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
# Auto-away's X11 idle source (`idle/x11.rs`): the SYNC extension's IDLETIME counter, MIT-SCREEN-SAVER's
# QueryInfo as the fallback, on a connection of its own. The version GPUI's X11 platform uses (Cargo.lock:
# x11rb 0.13.2, which GPUI already builds with `sync`); `screensaver` adds one extension module to it.
x11rb = { version = "0.13.1", features = ["sync", "screensaver"] }

# The version GPUI's Windows platform uses (Cargo.lock: windows 0.62.2), so every call here is
# checked against the same bindings as GPUI's own.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
