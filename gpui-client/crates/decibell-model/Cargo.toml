[package]
name = "decibell-model"
description = "The state model of the GPUI client: the core handle, the event pump, the stores (GPUI entities) between decibell-core and the views"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "decibell_model"

# Drives the core and the stores with no window, from a script on the command line
# (docs/model.md §8): the tool for the stack tests and for measuring core + model alone.
[[bin]]
name = "decibell-headless"
path = "src/bin/headless.rs"

[features]
# Lets a release build honour DECIBELL_CENTRAL (the local test stack). Test and
# measurement builds only: the shipping app must never turn it on (HANDOFF.md §3).
local-central = ["decibell-core/local-central"]

[dependencies]
gpui.workspace = true
# Only the headless binary uses it (the platform with no windowing).
gpui_platform.workspace = true
decibell-theme.workspace = true
# Never with core's `napi` feature.
# zbus on async-io, as GPUI's own dependencies use it: with the core's default (`zbus-tokio`, the
# Electron addon's) cargo would unify the features and GPUI's D-Bus calls would need a tokio context.
decibell-core = { path = "../../../crates/decibell-core", default-features = false, features = ["zbus-async-io"] }
# The attachment service: the composer's uploads (M2) and the downloads manager the
# Transfers panel mirrors (M3).
decibell-attachments = { path = "../decibell-attachments" }
anyhow.workspace = true
futures.workspace = true
log.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
arc-swap = "1"
# M2 (messages): the link-preview service, local days for the message list (chrono's
# clock is already in GPUI's tree), the TLS connector type of the attachment service's
# pin (`chat::composer::CoreTls`; the core's own copy).
decibell-unfurl = { path = "../decibell-unfurl" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio-rustls = { version = "0.26", default-features = false }

# The regional formats (`regional`): the locale's date / time / number data through
# `newlocale` + `nl_langinfo_l`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

# The hotkeys recorder is tested under Turkish and German keymaps: xkbcommon (the version
# GPUI's Linux layer links) says what each physical key types there.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
xkbcommon = { version = "0.8", default-features = false }
