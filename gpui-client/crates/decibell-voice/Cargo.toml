[package]
name = "decibell-voice"
description = "The voice view: the stage of participant and stream tiles, watching streams (focus, fullscreen, the mini-player), Go Live, per-user controls, connection stats, the incoming call and the call stage"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# The deterministic fixtures the screens are drawn from (hand-built core events through the
# model's router), their JSON export for the Electron captures, and the screens themselves.
fixtures = ["dep:serde_json", "dep:base64", "decibell-shell/fixtures"]

[[bin]]
name = "decibell-voice-fixture"
path = "src/bin/voice-fixture.rs"
required-features = ["fixtures"]

[dependencies]
gpui.workspace = true
decibell-theme.workspace = true
decibell-harness.workspace = true
decibell-ui.workspace = true
decibell-model.workspace = true
decibell-common.workspace = true
decibell-shell.workspace = true
decibell-video.workspace = true
# The core's API (stream volume, keyframe requests) and its event payloads (the fixtures).
# zbus on async-io, as every crate of this client takes the core (HANDOFF.md §5).
decibell-core = { path = "../../../crates/decibell-core", default-features = false, features = ["zbus-async-io"] }
anyhow.workspace = true
futures.workspace = true
log.workspace = true
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

# The source grid's stills and icons become GPUI images (the versions GPUI itself uses).
image = { version = "0.25", default-features = false }
smallvec = "1.6"

# What can be shared (src/sources/windows.rs): the version GPUI's Windows platform uses
# (Cargo.lock: windows 0.62.2), as decibell-platform takes it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
