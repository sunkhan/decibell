[package]
name = "decibell-shell"
description = "The app's shell: sign-in pages, the main layout and its chrome (server bar, channel sidebar, user panel, member list, home frame), the pane registry feature crates fill"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "decibell-shell-fixture"
path = "src/bin/shell-fixture.rs"
required-features = ["fixtures"]

[features]
# The deterministic fixture the shell's screens are drawn from (hand-built core events fed
# through the model's router), its JSON export for the Electron captures, and the screens.
fixtures = ["dep:serde_json"]

[dependencies]
gpui.workspace = true
decibell-theme.workspace = true
decibell-harness.workspace = true
decibell-ui.workspace = true
decibell-model.workspace = true
decibell-common.workspace = true
# Only for the payload types of the core's events (the fixture) and `UiError`'s cert fields.
# zbus on async-io, as every crate of this client takes the core (HANDOFF.md §5).
decibell-core = { path = "../../../crates/decibell-core", default-features = false, features = ["zbus-async-io"] }
decibell-richtext = { path = "../decibell-richtext" }
anyhow.workspace = true
futures.workspace = true
log.workspace = true
base64 = "0.22"
serde_json = { version = "1", optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
