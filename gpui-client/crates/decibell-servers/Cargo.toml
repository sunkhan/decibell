[package]
name = "decibell-servers"
description = "Communities outside the settings windows: Browse and every way to join, the deep-link join dialog, invites (manage, invite friends), the create-channel dialog, dragging the channel list with the category-sync prompt, and the welcome banner"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The screens' fixture as JSON for the Electron capture pages.
[[bin]]
name = "decibell-servers-fixture"
path = "src/bin/servers-fixture.rs"
required-features = ["fixtures"]

[features]
# The app's `dev-local` turns this on: the core then honours DECIBELL_CENTRAL in a release build,
# which the self-tests that register accounts check before they talk to any server.
dev-local = ["decibell-model/local-central"]
# The screens' fixture (the shell's, plus a directory, invites, friends, a syncing category, empty
# channels) and the screens drawn from it.
fixtures = ["decibell-shell/fixtures"]

[dependencies]
gpui.workspace = true
decibell-theme.workspace = true
decibell-harness.workspace = true
decibell-ui.workspace = true
decibell-text.workspace = true
decibell-model.workspace = true
decibell-common.workspace = true
decibell-shell.workspace = true
# The welcome slot of the chat pane.
decibell-chat.workspace = true
# The core's API (invites, channels, friends-in-community, the direct calls the renderer makes) and
# its event payloads (the fixture). zbus on async-io, as every crate of this client takes the core
# (HANDOFF.md §5).
decibell-core = { path = "../../../crates/decibell-core", default-features = false, features = ["zbus-async-io"] }
anyhow.workspace = true
futures.workspace = true
log.workspace = true
base64 = "0.22"
serde_json = "1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
