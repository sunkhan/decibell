[package]
name = "decibell-richtext"
version = "0.1.0"
edition = "2021"
publish = false
description = "Decibell's message rich-text grammar for the native client: the Electron renderer's richText.ts, emoji segmentation, autolinks / embeds / invite links and previews, as plain data (no GPUI, no I/O)"

[dependencies]
# UTS #46 (IDNA) for non-ASCII URL hosts only, which is what decides whether "https://x.com😂"
# autolinks. Already in the client binary through GPUI's `url` (same 1.1 in Cargo.lock).
idna = "1.1"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
