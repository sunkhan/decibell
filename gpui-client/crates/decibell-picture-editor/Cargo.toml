[package]
name = "decibell-picture-editor"
description = "The picture editor: crop a picked file into a profile picture or a server picture (pan, zoom, fill, EXIF orientation, the JPEG export)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Fixture pictures and the editor's screens.
fixtures = []

[dependencies]
gpui.workspace = true
decibell-theme.workspace = true
decibell-harness.workspace = true
decibell-ui.workspace = true
log.workspace = true
# Decode (with EXIF orientation), resample and encode: the codecs the renderer's file picker
# offers that the workspace already builds (as decibell-attachments takes them).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
smallvec = "1.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
