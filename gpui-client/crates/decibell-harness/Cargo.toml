[package]
name = "decibell-harness"
description = "What every crate of the GPUI client registers into: capture screens, self-tests, and the frame / startup instrumentation they read"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
anyhow.workspace = true
futures.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# tests/nested_cached_views.rs drives GPUI's test window (patches/0014).
gpui = { workspace = true, features = ["test-support"] }
