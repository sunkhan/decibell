[package]
name = "decibell-app"
description = "The Decibell desktop client (binary `decibell`)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "decibell_app"

[[bin]]
name = "decibell"
path = "src/main.rs"

# Renders registered screens to PNG files without a window. It needs GPUI's `test-support`
# feature, which must never be compiled into `decibell`: hence a feature, off by default.
#   cargo run -p decibell-app --features capture --bin decibell-capture -- --help
[[bin]]
name = "decibell-capture"
path = "src/bin/capture.rs"
required-features = ["capture"]

[features]
# Two flavours (gpui-client/PACKAGING.md, "Build flavours"):
# - development, the default: every screen, self-test and fixture, the scroll benchmark and the
#   release crate's test hooks; `dev-local` and `capture` add to it;
# - ship: `cargo build --release -p decibell-app --no-default-features --features ship`, none of
#   that; the updater and crash reports run (in a package). `src/lib.rs` refuses a mix.
default = ["dev"]
dev = [
    "dep:decibell-text-gallery",
    "decibell-shell/fixtures",
    "decibell-chat/fixtures",
    "decibell-voice/fixtures",
    "decibell-settings/fixtures",
    "decibell-composer/fixtures",
    "decibell-home/fixtures",
    "decibell-chat-content/fixtures",
    "decibell-server-settings/fixtures",
    "decibell-picture-editor/fixtures",
    "decibell-search/fixtures",
    "decibell-servers/fixtures",
    "decibell-release/test-hooks",
    # The avatar self-test reads the stack's accounts.json and checks the saved JPEG.
    "dep:serde_json",
    "image/jpeg",
]
ship = ["decibell-release/ship", "decibell-harness/ship"]
capture = ["dev", "gpui/test-support", "gpui_platform/test-support", "dep:gpui_wgpu"]
# Development, tests, captures and measurements only — never the shipped binary: honours
# DECIBELL_CENTRAL (the local test stack) and enables `--login`, the stdout markers and the
# perf control pipe (src/dev.rs).
dev-local = ["dev", "decibell-model/local-central", "dep:serde_json", "decibell-settings/dev-local", "decibell-chat-content/loopback", "decibell-servers/dev-local", "decibell-platform/dev-local"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
decibell-theme.workspace = true
decibell-harness.workspace = true
decibell-ui.workspace = true
# The focused hotkey fallback asks whether a text field has the focus.
decibell-text.workspace = true
decibell-text-gallery = { path = "../decibell-text/gallery", optional = true }
# `core`: the core's frames into the hub (`push_frame`, the frame pool).
decibell-video = { workspace = true, features = ["core"] }
decibell-model.workspace = true
decibell-shell.workspace = true
decibell-chat.workspace = true
decibell-voice.workspace = true
decibell-settings.workspace = true
decibell-composer.workspace = true
decibell-home.workspace = true
decibell-chat-content.workspace = true
decibell-server-settings.workspace = true
decibell-picture-editor.workspace = true
decibell-search.workspace = true
decibell-servers.workspace = true
decibell-platform.workspace = true
# The version, the updater, crash reports, the install facts.
decibell-release.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
# The X11 window icon (decoded from the bundled PNG); PNG for the captures; the
# `content-copy-image` self-test decodes what other processes read from the clipboard (the same
# `image` the content crate links: no new code in the binary).
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { version = "1", optional = true }
# The video glue's core calls (keyframe requests, the frame-sink flag, the decode caps), and the
# `encoder-software` self-test, which opens the core's software encoder (SVT-AV1) directly. The
# same line as decibell-model's, so the core's features do not diverge (zbus on async-io).
decibell-core = { path = "../../../crates/decibell-core", default-features = false, features = ["zbus-async-io"] }

# build.rs refuses an FFmpeg without SVT-AV1 and the software decoders (Linux: reads the static
# prefix pkg-config names; Windows: vcpkg's database).
[build-dependencies]
pkg-config = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_wgpu = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
