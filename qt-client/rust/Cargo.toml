[package]
name = "decibell_qt"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false

# A static library CMake links into the app (cxx-qt-cmake / Corrosion builds it).
[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
